name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 26.x]
        node-red-version: [4.0.0, 5.0.4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm install --no-save --package-lock=false node-red@${{ matrix.node-red-version }}
      - run: npm pack --dry-run
      - run: npm run lint
      - run: npm test

  fixture:
    name: ${{ matrix.fixture }} fixture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: compose
            command: npm run smoke
          - fixture: kind
            command: npm run test:kind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: helm/kind-action@v1.12.0
        if: matrix.fixture == 'kind'
        with:
          cluster_name: nuclio-node-red-canary
      - uses: azure/setup-helm@v4
        if: matrix.fixture == 'kind'
      - run: npm ci
      - run: ${{ matrix.command }}
