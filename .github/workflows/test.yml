name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 26.x]
        node-red-version: [4.0.0, 5.0.4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false node-red@${{ matrix.node-red-version }}
      - run: npm pack --dry-run
      - run: npm run lint
      - run: npm test
