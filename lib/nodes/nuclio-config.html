<style>
    .node_label_monospace {
        font-family: monospace;
        font-size: 0.82em;
        font-weight: 900;
    }

    .form-row small {
        max-width: 600px;
    }

    .nuclio-config-section {
        margin: 18px 0 8px;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--red-ui-secondary-border-color, #ddd);
        font-size: 1.05em;
        font-weight: 600;
    }

    .nuclio-config-section:first-child {
        margin-top: 0;
    }

    .nuclio-config-subsection {
        margin: 12px 0 6px;
        font-size: 0.95em;
        font-weight: 600;
    }

    .nuclio-config-details {
        margin-top: 12px;
    }

    .nuclio-config-details > summary {
        padding: 4px 0;
        cursor: pointer;
        font-weight: 600;
    }

    #node-config-input-request-headers .red-ui-editableList-item-content {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    #node-config-input-request-headers .node-input-header-name {
        flex: 0 0 38%;
    }

    #node-config-input-request-headers .red-ui-typedInput-container {
        flex: 1 1 auto;
        min-width: 0;
    }

    </style>

<script type="text/javascript">/* ------------------------------ Nuclio Server ----------------------------- */

    const nuclioServerInitHeaderList = (selector, items) => {
        const list = $(selector).editableList({
            addItem: function(row, index, data) {
                $(`<input class='node-input-header-name' type='text' placeholder='X-Header-Name' aria-label='Header name' />`)
                    .appendTo(row).val(data.name || '');
                $(`<input class='node-input-header-value' type='text' placeholder='value' aria-label='Header value' />`)
                    .appendTo(row).val(data.value || '').typedInput({
                        default: data.type || 'str',
                        types: ['str', 'env', 'cred'],
                    });
            },
            removable: true,
        });
        for (const item of items || []) list.editableList('addItem', item);
        return list;
    };

    const nuclioServerCollectHeaderList = (selector) => {
        const headers = [];
        $(selector).editableList('items').each(function() {
            const name = $(this).find('.node-input-header-name').val();
            const value = $(this).find('.node-input-header-value');
            if (name) headers.push({
                name,
                type: value.typedInput('type'),
                value: value.typedInput('value'),
            });
        });
        return headers;
    };

    const nuclioServerAuthValue = (node, field) => {
        const type = node[`${field}Type`] || (node.credentials?.[field] ? 'cred' : 'str');
        if (type === 'cred') return node.credentials?.[field] === '__PWRD__' ? '' : (node.credentials?.[field] || '');
        return node[field] || '';
    };

    RED.nodes.registerType('nuclio-config', {
        category: 'config',
        icon: "nuclio.io.ico",
        defaults: {
            address: { value: 'NUCLIO_ADDRESS', required: true },
            addressType: { value: 'env' },
            namespace: { value: 'nuclio' },
            namespaceType: { value: 'str' },
            publicAddress: { value: 'http://localhost:8070', required: false },
            publicAddressType: { value: 'str' },
            invocationUrlPreference: { value: 'service' },
            internalInvocationServiceHost: { value: '' },
            internalInvocationServiceHostType: { value: 'str' },
            externalInvocationProtocol: { value: 'https' },
            authType: { value: 'none' },
            authUsername: { value: '' },
            authUsernameType: { value: 'str' },
            authPassword: { value: '' },
            authPasswordType: { value: 'cred' },
            authToken: { value: '' },
            authTokenType: { value: 'cred' },
            deploymentPolicy: { value: 'managed' },
            deploymentPolicyType: { value: 'str' },
            // Shared connection, timeout, and reconciliation settings
            // (blank = built-in default).
            requestTimeoutMs: { value: '' }, requestTimeoutMsType: { value: 'num' },
            deployTimeoutMs:  { value: '' }, deployTimeoutMsType:  { value: 'num' },
            pollMs:           { value: '' }, pollMsType:           { value: 'num' },
            readyPollMs:      { value: '' }, readyPollMsType:      { value: 'num' },
            backoffMs:        { value: '' }, backoffMsType:        { value: 'num' },
            backoffMaxMs:     { value: '' }, backoffMaxMsType:     { value: 'num' },
            startStaggerMs:   { value: '' }, startStaggerMsType:   { value: 'num' },
        },
        credentials: {
            authPassword: { type: 'password' },
            authToken: { type: 'password' },
            requestHeaders: { type: 'text' },
        },
        label: function () {
            return this.publicAddress || this.address || 'Nuclio Server';
        },
        oneditprepare: function () {
            $('#node-config-input-address').typedInput({
                default: this.addressType,
                types: ['str', 'global', 'env'],
            });
            $('#node-config-input-publicAddress').typedInput({
                default: this.publicAddressType,
                types: ['str', 'global', 'env'],
            });
            $('#node-config-input-namespace').typedInput({
                default: this.namespaceType || 'str',
                types: ['str', 'global', 'env'],
            });
            $('#node-config-input-internalInvocationServiceHost').typedInput({
                default: this.internalInvocationServiceHostType || 'str',
                types: ['str', 'env'],
            });
            $('#node-config-input-deploymentPolicy').typedInput({
                default: this.deploymentPolicyType || 'str',
                types: ['str', 'env'],
            });
            $('#node-config-input-authUsername').typedInput({
                default: this.authUsernameType || 'str',
                types: ['str', 'env'],
            });
            $('#node-config-input-authPassword').typedInput({
                default: this.authPasswordType || 'cred',
                types: ['str', 'env', 'cred'],
            });
            $('#node-config-input-authToken').typedInput({
                default: this.authTokenType || 'cred',
                types: ['str', 'env', 'cred'],
            });
            $('#node-config-input-authType').val(this.authType || 'none');
            $('#node-config-input-authUsername').val(this.authUsername || '');
            $('#node-config-input-authPassword').val(nuclioServerAuthValue(this, 'authPassword'));
            $('#node-config-input-authToken').val(nuclioServerAuthValue(this, 'authToken'));

            let requestHeaders = [];
            try {
                if (this.credentials?.requestHeaders && this.credentials.requestHeaders !== '__PWRD__') {
                    requestHeaders = JSON.parse(this.credentials.requestHeaders) || [];
                }
            } catch (err) { /* runtime validation reports malformed credentials */ }
            this.requestHeadersList = nuclioServerInitHeaderList('#node-config-input-request-headers', requestHeaders);
            const updateAuthVisibility = () => {
                const authType = $('#node-config-input-authType').val() || 'none';
                $('#nuclio-basic-auth-fields').toggle(authType === 'basic');
                $('#nuclio-bearer-auth-fields').toggle(authType === 'bearer');
            };
            $('#node-config-input-authType').on('change', updateAuthVisibility);
            updateAuthVisibility();
            // Shared settings: numeric literal or an env-var reference, resolved on deploy.
            ['requestTimeoutMs','deployTimeoutMs','pollMs','readyPollMs','backoffMs','backoffMaxMs','startStaggerMs']
                .forEach(function(f){ $('#node-config-input-'+f).typedInput({ default: this[f+'Type'] || 'num', types: ['num','env'] }); }.bind(this));

            const updateInvocationOptionVisibility = function () {
                const preference = $('#node-config-input-invocationUrlPreference').val();
                $('#nuclio-service-host-row').toggle(preference === 'service');
                $('#nuclio-external-protocol-row').toggle(preference === 'external');
            };
            $('#node-config-input-invocationUrlPreference').on('change', updateInvocationOptionVisibility);
            updateInvocationOptionVisibility();
        },
        oneditsave: function() {
            this.authType = $('#node-config-input-authType').val() || 'none';
            this.authUsername = $('#node-config-input-authUsername').typedInput('value') || '';
            this.authUsernameType = $('#node-config-input-authUsername').typedInput('type');
            this.credentials = this.credentials || {};

            const saveAuthValue = field => {
                const input = $(`#node-config-input-${field}`);
                const type = input.typedInput('type');
                const value = input.typedInput('value') || '';
                this[`${field}Type`] = type;
                if (type === 'cred') {
                    delete this[field];
                    if (value) this.credentials[field] = value;
                    else if (this.credentials[field] !== '__PWRD__') delete this.credentials[field];
                } else {
                    this[field] = value;
                    delete this.credentials[field];
                }
            };
            if (this.authType === 'basic') {
                saveAuthValue('authPassword');
                delete this.authToken;
                delete this.authTokenType;
                delete this.credentials.authToken;
            } else if (this.authType === 'bearer') {
                saveAuthValue('authToken');
                delete this.authPassword;
                delete this.authPasswordType;
                delete this.credentials.authPassword;
            } else {
                delete this.authPassword;
                delete this.authPasswordType;
                delete this.authToken;
                delete this.authTokenType;
                delete this.credentials.authPassword;
                delete this.credentials.authToken;
            }

            const headers = nuclioServerCollectHeaderList('#node-config-input-request-headers');
            if (headers.length || this.credentials.requestHeaders !== '__PWRD__') {
                if (headers.length) this.credentials.requestHeaders = JSON.stringify(headers);
                else delete this.credentials.requestHeaders;
            }
            delete this.requestHeadersList;
        },
        oneditcancel: function() {
            delete this.requestHeadersList;
        },
    });

    
</script>

<script type="text/html" data-template-name="nuclio-config">
    <h3 class="nuclio-config-section">Dashboard connection</h3>
    <div class="form-row">
        <label for="node-config-input-address">
            <span>Dashboard URL</span>
        </label>
        <input type="text" id="node-config-input-address" placeholder="http://localhost:8070" />
        <div>
            <small>The address that node-red can reach nuclio at. (typically port 8070)</small>
        </div>
    </div>    
    <div class="form-row">
        <label for="node-config-input-namespace">
            <span>Nuclio function namespace</span>
        </label>
        <input type="text" id="node-config-input-namespace" placeholder="nuclio" />
        <div>
            <small>Namespace used to scope function and project requests. Defaults to <code>nuclio</code>.</small>
        </div>
    </div>
    <div class="form-row">
        <label for="node-config-input-publicAddress">
            <span>Dashboard URL for editor links (optional)</span>
        </label>
        <input type="text" id="node-config-input-publicAddress" placeholder="http://localhost:8070" />
        <div>
            <small>Address used only for Dashboard links in the editor. It does not affect deployment or invocation.</small>
        </div>
    </div>

    <details class="nuclio-config-details">
        <summary>Dashboard access</summary>
        <div class="form-row">
            <label for="node-config-input-authType">Dashboard authentication</label>
            <select id="node-config-input-authType" class="form-control">
                <option value="none">None</option>
                <option value="basic">Basic authentication</option>
                <option value="bearer">Bearer token</option>
            </select>
            <div>
                <small>Authentication is sent to the Nuclio dashboard from Node-RED. Credentials are not included in flow JSON, status, logs, or metrics.</small>
            </div>
        </div>
        <div id="nuclio-basic-auth-fields">
            <div class="form-row">
                <label for="node-config-input-authUsername">Username</label>
                <input type="text" id="node-config-input-authUsername" placeholder="username" />
            </div>
            <div class="form-row">
                <label for="node-config-input-authPassword">Password</label>
                <input type="text" id="node-config-input-authPassword" placeholder="password or environment variable" />
            </div>
        </div>
        <div id="nuclio-bearer-auth-fields">
            <div class="form-row">
                <label for="node-config-input-authToken">Bearer token</label>
                <input type="text" id="node-config-input-authToken" placeholder="token or environment variable" />
            </div>
        </div>
        <div class="form-row node-input-list-row">
            <label for="node-config-input-request-headers">Dashboard request headers</label>
            <div>
                <small>Optional headers sent with every dashboard request. Values support literals, environment variables, and credentials. Nuclio scope and transport headers are reserved.</small>
            </div>
            <ol id="node-config-input-request-headers"></ol>
        </div>
    </details>

    <details class="nuclio-config-details">
        <summary>Deployment policy</summary>
        <div class="form-row">
            <label for="node-config-input-deploymentPolicy">Deployment policy</label>
            <input type="text" id="node-config-input-deploymentPolicy" placeholder="managed (default)" />
            <div>
                <small>Use <code>managed</code> to create, update, and self-heal functions. Use <code>disabled</code> to prevent writes in this environment. Existing remote functions are not deleted.</small>
            </div>
        </div>
    </details>

    <h3 class="nuclio-config-section">Invocation routing</h3>
    <div class="form-row">
        <label for="node-config-input-invocationUrlPreference">Invocation endpoint source</label>
        <select id="node-config-input-invocationUrlPreference" class="form-control">
            <option value="service">Stable service hostname</option>
            <option value="internal">Nuclio-reported internal URL</option>
            <option value="external">Nuclio-reported external URL</option>
        </select>
        <div>
            <small>Choose exactly which endpoint source Node-RED should call. A stable service hostname avoids stale container or pod IP metadata.</small>
        </div>
    </div>
    <div class="form-row" id="nuclio-service-host-row">
        <label for="node-config-input-internalInvocationServiceHost">Stable service hostname template</label>
        <input type="text" id="node-config-input-internalInvocationServiceHost" placeholder="nuclio-{function} (Kubernetes default)" />
        <div>
            <small>Used only with Stable service hostname. Use <code>{function}</code> for the function name. Leave blank to use the Kubernetes default <code>nuclio-{function}</code>. Docker Compose commonly needs <code>nuclio-nuclio-{function}</code>.</small>
        </div>
    </div>
    <div class="form-row" id="nuclio-external-protocol-row">
        <label for="node-config-input-externalInvocationProtocol">External URL protocol</label>
        <select id="node-config-input-externalInvocationProtocol" class="form-control">
            <option value="https">HTTPS</option>
            <option value="http">HTTP</option>
        </select>
        <div>
            <small>Used only when Nuclio reports an external host without a scheme. Explicit http:// or https:// URLs are preserved.</small>
        </div>
    </div>

    <details class="nuclio-config-details">
        <summary style="cursor: pointer; font-weight: 600;">Operations (advanced)</summary>
        <div style="margin-top: 8px;">
            <small>These controls are shared by every function using this server. Leave them blank to use the built-in defaults.</small>
        </div>
        <h4 class="nuclio-config-subsection">Request timeouts</h4>
        <div class="form-row">
            <label for="node-config-input-requestTimeoutMs">Dashboard request timeout (ms)</label>
            <input type="text" id="node-config-input-requestTimeoutMs" placeholder="10000 ms (default)" />
        </div>
        <div class="form-row">
            <label for="node-config-input-deployTimeoutMs">Deployment request timeout (ms)</label>
            <input type="text" id="node-config-input-deployTimeoutMs" placeholder="60000 ms (default)" />
        </div>
        <h4 class="nuclio-config-subsection">Status polling and recovery</h4>
        <div class="form-row">
            <label for="node-config-input-pollMs">Transition status interval (ms)</label>
            <input type="text" id="node-config-input-pollMs" placeholder="1000 ms (default)" />
        </div>
        <div class="form-row">
            <label for="node-config-input-readyPollMs">Healthy status interval (ms)</label>
            <input type="text" id="node-config-input-readyPollMs" placeholder="5000 ms (default)" />
        </div>
        <div class="form-row">
            <label for="node-config-input-backoffMs">Dashboard failure backoff (ms)</label>
            <input type="text" id="node-config-input-backoffMs" placeholder="5000 ms (default)" />
        </div>
        <div class="form-row">
            <label for="node-config-input-backoffMaxMs">Maximum failure backoff (ms)</label>
            <input type="text" id="node-config-input-backoffMaxMs" placeholder="60000 ms (default)" />
        </div>
        <div class="form-row">
            <label for="node-config-input-startStaggerMs">Startup deployment stagger (ms)</label>
            <input type="text" id="node-config-input-startStaggerMs" placeholder="2000 ms (default)" />
        </div>
    </details>
</script>

<script type="text/html" data-help-name="nuclio-config">
    <p>Defines the Nuclio dashboard address used by Node-RED.</p>
    <h3>Fields</h3>
    <dl class="message-properties">
        <dt>Nuclio Dashboard URL</dt>
        <dd>Address reachable by Node-RED (typically <code>http://host:8070</code>).</dd>
        <dt>Public Nuclio Dashboard URL</dt>
        <dd>Optional public address used for links in the editor.</dd>
        <dt>Nuclio Namespace</dt>
        <dd>Namespace sent with function and project requests. Defaults to <code>nuclio</code>.</dd>
        <dt>Invocation endpoint source</dt>
        <dd>Choose a stable service hostname or a Nuclio-reported internal or external URL.</dd>
        <dt>External URL protocol</dt>
        <dd>Scheme used for scheme-less external URLs reported by Nuclio. Explicit schemes are preserved.</dd>
        <dt>Deployment policy</dt>
        <dd><code>managed</code> (the default) allows deployment and self-healing. <code>disabled</code> prevents writes and leaves existing remote functions untouched. The value can use the <code>env</code> type.</dd>
        <dt>Dashboard authentication</dt>
        <dd>Optional Basic or Bearer authentication sent to the dashboard. Passwords and tokens support literal, environment, and credential typed inputs; choose credentials for secrets. Additional request headers are configured separately.</dd>
    </dl>
</script>
