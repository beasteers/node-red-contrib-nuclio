)

}

<script type="text/javascript">
    // Names already taken by other nuclio-function configs on the same
    // server/project (used by the name validator + generator).
    const getUniqueValues = (node, key) => {
        let endpoints = {};
        RED.nodes.eachConfig(n => {
            if (n.type !== "nuclio-function" || n.server !== node.server || n.project !== node.project || n.id === node.id) return;
            endpoints[key(n)] = n.id;
        });
        return endpoints;
    };

    class Poller {
        constructor(fn, interval) {
            this.fn = fn;
            this.interval = interval;
            this.timer = null;
            this.running = false;
            this.inFlight = false;
        }

        start() {
            if (this.running) return;
            this.running = true;
            this.tick();
        }

        async tick() {
            if (!this.running || this.inFlight) return;
            this.inFlight = true;
            try {
                await this.fn();
            } catch {
                // The poll callback owns its display of request failures.
            } finally {
                this.inFlight = false;
                if (this.running) this.timer = setTimeout(() => this.tick(), this.interval);
            }
        }

        stop() {
            this.running = false;
            if (this.timer) clearTimeout(this.timer);
            this.timer = null;
        }
    }

    // escape anything API/log-derived before it goes into innerHTML
    const esc = (s) => `${s}`.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const stripAnsi = (value) => `${value ?? ''}`
        .replace(/\u001B\[[0-?]*[ -/]*[@-~]/g, '')
        .replace(/\u009B[0-?]*[ -/]*[@-~]/g, '')
        .replace(/\r\n/g, '\n');

    const humanizeKey = (key) => `${key}`
        .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
        .replace(/[_-]+/g, ' ')
        .replace(/\bhttp\b/gi, 'HTTP')
        .replace(/\burl(s?)\b/gi, 'URL$1')
        .replace(/\bapi\b/gi, 'API')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/^\w/, c => c.toUpperCase());

    const fmt = (obj) => Object.entries(obj).map(([k,v]) => {
        if (typeof v === 'string' && v.includes('\n')) {
            return `<div class="nuclio-kv-row"><span class="nuclio-kv-key">${esc(humanizeKey(k))}</span><span class="nuclio-kv-value nuclio-kv-multiline">${esc(stripAnsi(v))}</span></div>`;
        }
        return `<div class="nuclio-kv-row"><span class="nuclio-kv-key">${esc(humanizeKey(k))}</span><span class="nuclio-kv-value">${esc(stripAnsi(JSON.stringify(v)))}</span></div>`;
    }).join('');

    const statusChips = (obj) => Object.entries(obj || {}).map(([k,v]) => {
        const value = stripAnsi(typeof v === 'string' ? v : JSON.stringify(v));
        return `<span class="nuclio-chip"><span class="nuclio-chip-key">${esc(humanizeKey(k))}</span><span class="nuclio-chip-value">${esc(value)}</span></span>`;
    }).join('');

    // don't clobber text the user is selecting/reading
    const canUpdateElement = (element) => {
        if (!element) return true;
        const selection = window.getSelection();
        if (!selection || selection.isCollapsed) return true;
        if (!selection.rangeCount) return true;
        const range = selection.getRangeAt(0);
        return !element.contains(range.commonAncestorContainer);
    };

    const statusTone = (state) => {
        if (!state || typeof state !== 'string') return 'unknown';
        if (state === 'unavailable') return 'unavailable';
        if (state === 'ready') return 'ok';
        if (state === 'error' || state === 'unhealthy') return 'error';
        if (state === 'scaledToZero') return 'idle';
        if (state.includes('waiting') || state === 'building' || state === 'configuringResources') return 'working';
        return 'warn';
    };

    const getAuthHeaders = () => {
        const headers = {};
        if (!RED.settings || typeof RED.settings.get !== 'function') return headers;
        const authTokens = RED.settings.get("auth-tokens") || {};
        const token = authTokens.access_token || authTokens.token;
        if (token) headers.Authorization = `Bearer ${token}`;
        return headers;
    };

    const ajaxJson = (options) => $.ajax({
        dataType: 'json',
        ...options,
        headers: {
            ...getAuthHeaders(),
            ...(options.headers || {}),
        },
    });

    const setActionFeedback = (message, tone = 'info') => {
        const feedback = document.getElementById('nuclio-action-feedback');
        if (!feedback) return;
        feedback.textContent = message || '';
        feedback.dataset.tone = tone;
        feedback.classList.toggle('nuclio-hidden', !message);
    };

    // key/value rows: a text key + a typed value. Shared by request headers
    // and environment variables.
    const initKeyValueList = (selector, items, { placeholder, defaultType, types }) => {
        const list = $(selector).editableList({
            addItem: function(row, index, data) {
                $(`<input class='node-input-key' type="text" aria-label="Name" />`)
                    .attr('placeholder', placeholder)
                    .appendTo(row).val(data.name || '');
                const valueInput = $(`<input class='node-input-value' type="text" placeholder="value" aria-label="Value" />`)
                    .appendTo(row).val(data.value);
                valueInput.typedInput({
                    default: data.type || defaultType,
                    types: types,
                });
            },
            removable: true,
        });
        for (let data of items || []) {
            list.editableList('addItem', data);
        }
        return list;
    };

    const collectKeyValueList = (selector) => {
        const rows = [];
        $(selector).editableList('items').each(function() {
            const name = $(this).find(".node-input-key").val();
            const type = $(this).find(".node-input-value").typedInput('type');
            const value = $(this).find(".node-input-value").typedInput('value');
            name && rows.push({ name, type, value });
        });
        return rows;
    };

    const initDeploymentVariableList = (selector, items) => {
        const list = $(selector).editableList({
            addItem: function(row, index, data) {
                row.addClass('nuclio-deployment-variable-row');
                $(`<input class='node-input-key' type="text" placeholder="VARIABLE_NAME" aria-label="Variable name" />`)
                    .appendTo(row).val(data.name || '');
                $(`<input class='node-input-value' placeholder="value, environment variable name, or secret" aria-label="Variable value" />`)
                    .appendTo(row).val(data.value || '').typedInput({
                        default: data.type || 'str',
                        types: ['str', 'env', 'cred'],
                    });
                const secretLabel = $('<label class="nuclio-deployment-variable-secret"><input type="checkbox" aria-label="Treat value as secret" /> secret</label>')
                    .appendTo(row);
                secretLabel.find('input').prop('checked', data.secret === true || data.type === 'cred');
            },
            removable: true,
        });
        for (const data of items || []) list.editableList('addItem', data);
        return list;
    };

    const collectDeploymentVariableList = (selector) => {
        const rows = [];
        $(selector).editableList('items').each(function() {
            const name = $(this).find('.node-input-key').val();
            const input = $(this).find('.node-input-value');
            const secret = $(this).find('.nuclio-deployment-variable-secret input').prop('checked');
            if (name) rows.push({
                name,
                type: input.typedInput('type'),
                value: input.typedInput('value'),
                secret,
            });
        });
        return rows;
    };

    const initSecretReferenceList = (selector, items) => {
        const list = $(selector).editableList({
            addItem: function(row, index, data) {
                row.addClass('nuclio-secret-reference-row');
                $(`<input type='text' placeholder='ENV_NAME' aria-label='Environment variable name' />`)
                    .appendTo(row).val(data.name || '');
                $(`<input type='text' placeholder='Secret name' aria-label='Kubernetes secret name' />`)
                    .appendTo(row).val(data.secretName || '');
                $(`<input type='text' placeholder='Secret key' aria-label='Kubernetes secret key' />`)
                    .appendTo(row).val(data.secretKey || '');
            },
            removable: true,
        });
        for (const data of items || []) list.editableList('addItem', data);
        return list;
    };

    const collectSecretReferenceList = (selector) => {
        const rows = [];
        $(selector).editableList('items').each(function() {
            const inputs = $(this).find('input');
            const name = inputs.eq(0).val();
            const secretName = inputs.eq(1).val();
            const secretKey = inputs.eq(2).val();
            if (name && secretName && secretKey) rows.push({ name, secretName, secretKey });
        });
        return rows;
    };
</script>

<script type="text/javascript">/* ---------------------------- Nuclio Function ----------------------------- */

    // Validation helpers. These read the live dialog inputs while the editor
    // is open and fall back to the stored node values when the framework
    // validates a node outside a dialog (flow load, palette). Cross-field
    // checks must use these because Node-RED only passes the field's own live
    // value to a validate function; other properties on `this` are the last
    // saved values until the dialog's inputs are written back on save.
    const editorFieldValue = (node, field) => {
        const input = $('#node-config-input-' + field);
        return input.length ? (input.val() || '') : (node[field] ?? '');
    };

    const editorFieldType = (node, field) => {
        const input = $('#node-config-input-' + field);
        if (input.length && input.next('.red-ui-typedInput-container').length) {
            return input.typedInput('type');
        }
        return node[field + 'Type'] || 'str';
    };

    const scalingFieldError = (node, field, value) => {
        const mode = editorFieldValue(node, 'scalingMode') || 'yaml';
        if (mode === 'yaml') return null;
        if (!value) {
            if (mode === 'fixed' && field === 'scalingReplicas') {
                return 'Fixed scaling requires a replica count';
            }
            return null;
        }
        if (editorFieldType(node, field) === 'env') return null;
        const num = Number(value);
        if (!Number.isInteger(num)) return 'Must be an integer';
        if (field === 'scalingReplicas') {
            return num < 1 ? 'Must be a positive integer' : null;
        }
        if (field === 'scalingMinReplicas' || field === 'scalingMaxReplicas') {
            if (num < 0) return 'Must be a non-negative integer';
            if (mode === 'autoscaled') {
                const other = field === 'scalingMinReplicas' ? 'scalingMaxReplicas' : 'scalingMinReplicas';
                const otherValue = editorFieldValue(node, other);
                const otherType = editorFieldType(node, other);
                if (otherValue && otherType !== 'env' && Number.isInteger(Number(otherValue))) {
                    if (field === 'scalingMinReplicas' && Number(otherValue) < num) {
                        return 'Minimum cannot exceed maximum replicas';
                    }
                    if (field === 'scalingMaxReplicas' && Number(otherValue) > num) {
                        return 'Maximum cannot be below minimum replicas';
                    }
                }
            }
            return null;
        }
        if (field === 'scalingTargetCPU') {
            return (num < 1 || num > 100) ? 'Must be an integer from 1 to 100' : null;
        }
        return null;
    };

    const validateScalingField = (field) => function(value) {
        return scalingFieldError(this, field, value) || true;
    };

    RED.nodes.registerType('nuclio-function', {
        category: 'config',
        icon: "nuclio.io.ico",
        defaults: {
            server: {
                type: 'nuclio-config',
                required: false,
            },
            project: {
                type: 'nuclio-project',
                required: false,
            },
            name: { value: '', validate: function(v) {
                if (VALIDATION.validateFunctionName?.(v)) return false;
                return !getUniqueValues(this, n=>n.name)[v];
            } },
            runtime: { value: 'python:3.12' },
            sourceType: { value: 'sourceCode' },
            codeEntryPath: { value: '', validate: function(v) {
                return !VALIDATION.validateSourcePath?.(this.sourceType || 'sourceCode', v);
            } },
            codeEntryBranch: { value: '' },
            codeEntryTag: { value: '' },
            codeEntryReference: { value: '' },
            codeEntryUsername: { value: '' },
            codeEntryWorkDir: { value: '' },
            code: { value: SAMPLES.python.code },
            configCode: { value: SAMPLES.python.config },
            env_vars: { value: [] },
            envSecretRefs: { value: [] },
            deploymentVariables: { value: [] },
            deploymentMode: { value: 'eager' },
            executionTriggerName: { value: '' },
            executionMode: { value: 'inherit' },
            executionBatchMode: { value: 'inherit' },
            executionBatchSize: { value: '' }, executionBatchSizeType: { value: 'num' },
            executionBatchTimeout: { value: '' }, executionBatchTimeoutType: { value: 'str' },
            executionWorkers: { value: '' }, executionWorkersType: { value: 'num' },
            executionEventTimeout: { value: '' }, executionEventTimeoutType: { value: 'str' },
            scalingMode: { value: 'yaml' },
            scalingReplicas: { value: '', validate: validateScalingField('scalingReplicas') }, scalingReplicasType: { value: 'num' },
            scalingMinReplicas: { value: '', validate: validateScalingField('scalingMinReplicas') }, scalingMinReplicasType: { value: 'num' },
            scalingMaxReplicas: { value: '', validate: validateScalingField('scalingMaxReplicas') }, scalingMaxReplicasType: { value: 'num' },
            scalingTargetCPU: { value: '', validate: validateScalingField('scalingTargetCPU') }, scalingTargetCPUType: { value: 'num' },
            resourceRequestsCpu: { value: '' }, resourceRequestsCpuType: { value: 'str' },
            resourceRequestsMemory: { value: '' }, resourceRequestsMemoryType: { value: 'str' },
            resourceLimitsCpu: { value: '' }, resourceLimitsCpuType: { value: 'str' },
            resourceLimitsMemory: { value: '' }, resourceLimitsMemoryType: { value: 'str' },
            // Recovery policy (blank = built-in default).
            maxSelfHealAttempts: { value: '' }, maxSelfHealAttemptsType: { value: 'num' },
            redeployDeadlineMs:  { value: '' }, redeployDeadlineMsType:  { value: 'num' },
            autoRedeployOnUnhealthy: { value: 'false' }, autoRedeployOnUnhealthyType: { value: 'bool' },
            autoRedeployOnError: { value: 'false' }, autoRedeployOnErrorType: { value: 'bool' },
        },
        credentials: {
            deploymentVariables: { type: "text" }, // JSON list of { name, type, value, secret }
            environmentVariables: { type: "text" }, // JSON list of runtime environment entries
            codeEntryPassword: { type: "password" },
        },
        label: function () {
            return this.name || 'nuclio fn';
        },
        oneditprepare: function() {
            let node = this;
            node.originalName = node.name;
            node.nuclioEditorDirty = false;

            const generateUniqueName = () => {
                let name = randomEndpoint();
                let existing = getUniqueValues(node, n=>n.name);
                while (existing[name]) {
                    name = randomEndpoint();
                }
                return name;
            };
            // New or legacy functions without a name get one generated here,
            // where the user can see it, rather than inside the validator.
            if (!node.name) {
                node.name = generateUniqueName();
                $('#node-config-input-name').val(node.name);
                // The generated name is an unsaved edit: redeploy/rebuild must
                // warn that they use the last saved configuration.
                node.nuclioEditorDirty = true;
            }

            const runtimeSelect = $('#node-config-input-runtime');
            const selectedRuntime = this.runtime || 'python:3.12';
            const runtimeOptions = [...RUNTIME_METADATA];
            if (selectedRuntime && !runtimeOptions.some(item => item.value === selectedRuntime)) {
                const [base] = selectedRuntime.split(':');
                runtimeOptions.push({
                    value: selectedRuntime,
                    base,
                    label: selectedRuntime,
                    language: 'text',
                    handler: 'main:handler',
                });
            }
            runtimeSelect.empty();
            runtimeOptions.forEach(item => $('<option>').val(item.value).text(item.label).appendTo(runtimeSelect));
            runtimeSelect.val(selectedRuntime);

            const markEditorDirty = () => {
                node.nuclioEditorDirty = true;
            };

            const confirmOperationalAction = (action) => {
                const savedState = node.nuclioEditorDirty
                    ? 'This editor has unsaved changes. '
                    : '';
                return window.confirm(`${savedState}${action} uses the last saved configuration, not unsaved editor changes. Continue?`);
            };

            /* ------------------------------ Buttons / Links ------------------------------ */

            const updateDashboardLink = () => {
                const name = $('#node-config-input-name').val();
                const project = RED.nodes.node(node.project)?.name || 'default';
                const server = RED.nodes.node(node.server);
                const publicAddress = server?.publicAddress || '';
                // Only http(s) dashboard addresses may be linked. Flow-authored
                // data must never reach an href unvalidated, and path segments
                // are encoded so names with spaces or special characters work.
                const base = publicAddress.replace(/\/+$/, '');
                let fullUrl = '';
                if (name && /^https?:\/\//i.test(base)) {
                    fullUrl = `${base}/projects/${encodeURIComponent(project)}/functions/${encodeURIComponent(name)}/code`;
                }
                if (fullUrl) {
                    $('#nuclio-dashboard-link').attr('href', fullUrl).removeClass('nuclio-hidden');
                } else {
                    $('#nuclio-dashboard-link').addClass('nuclio-hidden');
                }
            };

            updateDashboardLink();

            $("#nuclio-dashboard-link").on('pointerdown', function () {
                let name = $('#node-config-input-name').val();
                if (!name) return;

                updateDashboardLink();
            });
            $('#node-config-input-name').on('input', updateDashboardLink);
            $('#node-config-input-project, #node-config-input-server').on('change', updateDashboardLink);
            $('#nuclio-redeploy').on('click', function() {
                if (!confirmOperationalAction('Redeploy the existing image for this Nuclio function now?')) return;
                const btn = $(this);
                btn.prop('disabled', true).text('Redeploying image...');
                setActionFeedback('Redeploying the existing image. Unsaved editor changes are not included.', 'working');
                ajaxJson({
                    url: `/nuclio/api/functions/deploy?id=${node.id}`,
                    method: 'POST',
                }).done(function() {
                    setActionFeedback('Redeploy request accepted. Status will refresh automatically.', 'ok');
                }).fail((e) => {
                    const message = e?.responseJSON?.error || e?.statusText || 'Redeploy failed.';
                    setActionFeedback(`Redeploy failed: ${message}`, 'error');
                }).always(() => {
                    btn.prop('disabled', false).text('Redeploy');
                });
            });
            $('#nuclio-rebuild').on('click', function() {
                if (!confirmOperationalAction('Re-fetch the source, rebuild the image, and redeploy this Nuclio function now?')) return;
                const btn = $(this);
                btn.prop('disabled', true).text('Rebuilding image...');
                setActionFeedback('Rebuilding the image. Unsaved editor changes are not included.', 'working');
                ajaxJson({
                    url: `/nuclio/api/functions/deploy?id=${node.id}&rebuild=true`,
                    method: 'POST',
                }).done(function() {
                    setActionFeedback('Rebuild request accepted. Status will refresh automatically.', 'ok');
                }).fail((e) => {
                    const message = e?.responseJSON?.error || e?.statusText || 'Rebuild failed.';
                    setActionFeedback(`Rebuild failed: ${message}`, 'error');
                }).always(() => {
                    btn.prop('disabled', false).text('Rebuild');
                });
            });
            $('#nuclio-generate-name').on('click', function() {
                markEditorDirty();
                $('#node-config-input-name').val(generateUniqueName());
            });

            /* -------------------------------- Code Editors ------------------------------- */

            this.editor = RED.editor.createEditor({
                id: 'node-config-input-nuclio-editor',
                mode: `ace/mode/${langFor(node.runtime || 'python:3.12')}`,
                value: this.code || "",
                focus: true,
            });

            this.configeditor = RED.editor.createEditor({
                id: 'node-config-input-nuclio-config-editor',
                mode: `ace/mode/yaml`,
                value: this.configCode || "",
                focus: true,
            });
            this.configEditorAssist = window.NUCLIO_CONFIG_EDITOR?.attach(this.configeditor, {
                getRuntime: () => $('#node-config-input-runtime').val(),
            });

            const legacySource = sourceFromConfigCode(this.configCode);
            const sourceType = this.sourceType
                ? (SOURCE_TYPE_LABELS[this.sourceType] ? this.sourceType : 'advanced')
                : legacySource.type || 'sourceCode';
            $('#node-config-input-sourceType').val(sourceType);
            $('#node-config-input-codeEntryPath').val(this.codeEntryPath || legacySource.path || '');
            $('#node-config-input-codeEntryBranch').val(this.codeEntryBranch || legacySource.branch || '');
            $('#node-config-input-codeEntryTag').val(this.codeEntryTag || legacySource.tag || '');
            $('#node-config-input-codeEntryReference').val(this.codeEntryReference || legacySource.reference || '');
            $('#node-config-input-codeEntryUsername').val(this.codeEntryUsername || legacySource.username || '');
            $('#node-config-input-codeEntryWorkDir').val(this.codeEntryWorkDir || legacySource.workDir || '');
            $('#node-config-input-codeEntryPassword').val(
                this.credentials?.codeEntryPassword === '__PWRD__' ? '' : (this.credentials?.codeEntryPassword || '')
            );

            const updateSourceFields = () => {
                const selected = $('#node-config-input-sourceType').val() || 'sourceCode';
                $('.nuclio-source-fields').addClass('nuclio-hidden');
                $(`#nuclio-source-fields-${selected}`).removeClass('nuclio-hidden');
                const external = selected !== 'sourceCode';
                const hasSourceFields = ['image', 'git', 'archive'].includes(selected);
                $('#nuclio-source-path-field').toggleClass('nuclio-hidden', !hasSourceFields);
                $('#nuclio-source-workdir-field').toggleClass('nuclio-hidden', !['git', 'archive'].includes(selected));
                $('#nuclio-source-path-label').html(selected === 'image'
                    ? 'Image name'
                    : 'URL <span class="nuclio-required">*</span>');
                $('#node-config-input-codeEntryPath').attr('placeholder', selected === 'image'
                    ? 'For example: mydockeruser/my-func:latest'
                    : selected === 'git'
                        ? 'For example: https://github.com/my-organization/my-repository.git'
                        : 'For example: https://example.com/my-function.zip');
                $('#nuclio-inline-code-note').toggleClass('nuclio-hidden', selected === 'sourceCode');
                $('#nuclio-inline-code-note').text(selected === 'advanced'
                    ? 'Advanced source configuration is controlled in the Config tab.'
                    : 'Online code is disabled for this source type. The repository or image above is deployed instead.');
                $('#node-config-input-nuclio-editor').toggleClass('nuclio-hidden', external);
                $('#nuclio-handler-preview').val(defaultHandlerFor($('#node-config-input-runtime').val()));
            };

            $('#node-config-input-sourceType').on('change', function() {
                updateSourceFields();
                markEditorDirty();
            });
            updateSourceFields();
            this.editor.on('change', markEditorDirty);
            this.configeditor.on('change', markEditorDirty);

            $('#node-config-input-runtime').on('change', function() {
                const runtime = $(this).val();
                const [runtimeBase] = runtime.split(':');
                const lang = langFor(runtime);

                let code = node.editor.getValue();
                let configCode = node.configeditor.getValue();
                const codes = Object.values(SAMPLES).map(v => v.code);
                const configCodes = Object.values(SAMPLES).map(v => v.config);
                const sample = SAMPLES[runtimeBase];
                if (sample && (code.trim() === '' || codes.includes(code))) {
                    code = sample.code;
                    node.editor.setValue(code);
                }
                if (sample && (configCode.trim() === '' || configCodes.includes(configCode))) {
                    node.configeditor.setValue(sample.config);
                }
                node.editor.setMode(`ace/mode/${lang}`);
                $('#nuclio-handler-preview').val(defaultHandlerFor(runtime));
                // `async` mode is Python-only. Reset it when switching to
                // another runtime so a non-Python function cannot be saved
                // with an execution mode that Nuclio will reject at deploy.
                const executionMode = $('#node-config-input-executionMode');
                if (!runtime.startsWith('python') && executionMode.val() === 'async') {
                    executionMode.val('inherit');
                    markEditorDirty();
                }
                updateExecutionOptions();
            });

            /* ---------------------------------- Settings --------------------------------- */

            let deploymentVariables = this.deploymentVariables || [];
            try {
                if (this.credentials?.deploymentVariables && this.credentials.deploymentVariables !== '__PWRD__') {
                    deploymentVariables = JSON.parse(this.credentials.deploymentVariables) || deploymentVariables;
                }
            } catch (e) { /* ignore malformed values; runtime validation reports it */ }
            this.deploymentVariableList = initDeploymentVariableList('#node-config-input-deploymentVariables-x', deploymentVariables);

            const envVars = NUCLIO_CREDENTIAL_LIST.getEntries(this, this.env_vars, 'environmentVariables');
            this.envList = initKeyValueList("#node-config-input-env_vars-x", envVars, {
                placeholder: 'VAR_NAME',
                defaultType: 'str',
                types: ['str','num','json','env','cred'],
            });
            this.envSecretRefList = initSecretReferenceList('#node-config-input-env_secret_refs-x', this.envSecretRefs);

            $('#node-config-input-executionTriggerName').val(this.executionTriggerName || 'default-http');
            $('#node-config-input-executionMode').val(this.executionMode || 'inherit');
            $('#node-config-input-executionBatchMode').val(this.executionBatchMode || 'inherit');
            $('#node-config-input-executionBatchSize').val(this.executionBatchSize || '');
            $('#node-config-input-executionBatchTimeout').val(this.executionBatchTimeout || '');
            $('#node-config-input-executionWorkers').val(this.executionWorkers || '');
            $('#node-config-input-executionEventTimeout').val(this.executionEventTimeout || '');
            const initTypedInput = (field, types, fallback) => {
                const typeFieldSelector = '#node-config-input-' + field + 'Type';
                const typeField = $(typeFieldSelector);
                if (!typeField.val()) typeField.val(node[field + 'Type'] || fallback);
                $('#node-config-input-' + field).typedInput({
                    typeField: typeFieldSelector,
                    types,
                });
            };
            initTypedInput('executionBatchSize', ['num', 'env'], 'num');
            initTypedInput('executionWorkers', ['num', 'env'], 'num');
            initTypedInput('executionBatchTimeout', ['str', 'env'], 'str');
            initTypedInput('executionEventTimeout', ['str', 'env'], 'str');

            const updateExecutionOptions = () => {
                const isPython = ($('#node-config-input-runtime').val() || '').startsWith('python');
                $('#node-config-input-executionMode option[value="async"]').prop('disabled', !isPython);
                $('#nuclio-execution-async-note').toggleClass('nuclio-hidden', isPython);
            };
            updateExecutionOptions();

            const scalingNumberFields = ['scalingReplicas', 'scalingMinReplicas', 'scalingMaxReplicas', 'scalingTargetCPU'];
            const resourceFields = ['resourceRequestsCpu', 'resourceRequestsMemory', 'resourceLimitsCpu', 'resourceLimitsMemory'];
            [...scalingNumberFields, ...resourceFields].forEach(field => {
                $('#node-config-input-' + field).val(this[field] ?? '');
            });
            scalingNumberFields.forEach(field => {
                initTypedInput(field, ['num', 'env'], 'num');
            });
            resourceFields.forEach(field => {
                initTypedInput(field, ['str', 'env'], 'str');
            });

            const scalingFieldsHaveValues = ['scalingReplicas', 'scalingMinReplicas', 'scalingMaxReplicas', 'scalingTargetCPU']
                .some(field => this[field] !== undefined && this[field] !== '');
            const inferredScalingMode = this.scalingMode && ['yaml', 'fixed', 'autoscaled'].includes(this.scalingMode)
                ? this.scalingMode
                : !scalingFieldsHaveValues
                    ? 'yaml'
                    : this.scalingReplicas === '0' || ['scalingMinReplicas', 'scalingMaxReplicas', 'scalingTargetCPU']
                        .some(field => this[field] !== undefined && this[field] !== '')
                        ? 'autoscaled'
                        : 'fixed';
            $('#node-config-input-scalingMode').val(inferredScalingMode);

            const updateScalingOptions = () => {
                const mode = $('#node-config-input-scalingMode').val() || 'yaml';
                $('#nuclio-scaling-fixed-fields').toggleClass('nuclio-hidden', mode !== 'fixed');
                $('#nuclio-scaling-autoscaled-fields').toggleClass('nuclio-hidden', mode !== 'autoscaled');
                $('#nuclio-scaling-yaml-note').toggleClass('nuclio-hidden', mode !== 'yaml');
                $('#node-config-input-scalingReplicas').prop('disabled', mode !== 'fixed');
                ['scalingMinReplicas', 'scalingMaxReplicas', 'scalingTargetCPU'].forEach(field => {
                    $('#node-config-input-' + field).prop('disabled', mode !== 'autoscaled');
                });
            };
            $('#node-config-input-scalingMode').off('change.nuclioScaling').on('change.nuclioScaling', updateScalingOptions);
            updateScalingOptions();

            // Recovery policy: numeric literal or env-var reference, resolved on deploy.
            ['maxSelfHealAttempts','redeployDeadlineMs'].forEach(function(f){
                initTypedInput(f, ['num', 'env'], 'num');
            });
            initTypedInput('autoRedeployOnUnhealthy', ['bool', 'env'], 'bool');
            initTypedInput('autoRedeployOnError', ['bool', 'env'], 'bool');

            // Track edits made in the dialog so operational actions can state
            // clearly that they use the last saved node configuration.
            const dialogForm = $('#node-config-dialog-edit-form');
            dialogForm.on('input.nuclioFunctionDirty change.nuclioFunctionDirty', 'input, select, textarea', markEditorDirty);
            dialogForm.on('click.nuclioFunctionDirty', '#node-config-input-deploymentVariables-x button, #node-config-input-env_vars-x button, #node-config-input-env_secret_refs-x button', markEditorDirty);

            /* --------------------------------- Status Page -------------------------------- */

            const detailRequests = {};
            const detailCodeIds = {
                runLogs: 'nuclio-logs',
                buildLogs: 'nuclio-deploy-logs',
                spec: 'nuclio-spec',
            };
            const statusElement = (id) => document.getElementById(id);
            const asList = (value) => Array.isArray(value) ? value.filter(Boolean) : (value ? [value] : []);

            const renderEndpoints = (status, invocation) => {
                const preference = invocation?.preference || 'service';
                const activeUrls = new Set(asList(invocation?.urls));
                const groups = [
                    { key: 'service', label: 'Service', urls: asList(invocation?.serviceUrls) },
                    { key: 'internal', label: 'Internal', urls: asList(invocation?.internalUrls || status.internalInvocationUrls) },
                    { key: 'external', label: 'External', urls: asList(invocation?.externalUrls || status.externalInvocationUrls) },
                ];
                const endpoints = groups.flatMap(({ key, label, urls }) => urls.map(url => ({
                    label,
                    url,
                    active: activeUrls.has(url) && key === preference,
                })));
                const container = $('#nuclio-endpoints');
                if (!endpoints.length) {
                    container.html('<div class="nuclio-status-section-note">No invocation endpoint available.</div>');
                    return;
                }
                container.html(endpoints.map(({ label, url, active }) =>
                    `<div class="nuclio-endpoint-row"><span class="nuclio-endpoint-label">${esc(label)}</span><span class="nuclio-endpoint-value" title="${esc(url)}">${esc(url)}</span>${active ? '<span class="nuclio-endpoint-active">Active</span>' : '<span></span>'}</div>`
                ).join(''));
            };

            const renderSummary = (data) => {
                const status = data?.status || {};
                const invocation = data?.invocation || {};
                const metadata = data?.metadata || {};
                const spec = data?.spec || {};
                const state = status.state || 'unknown';
                const tone = statusTone(state);
                const server = RED.nodes.node(node.server);
                const preference = invocation.preference || server?.invocationUrlPreference || 'service';
                const mode = preference === 'internal'
                    ? 'Internal'
                    : preference === 'external'
                        ? 'External'
                        : 'Service';
                const numberValue = value => {
                    if (typeof value === 'number' && Number.isFinite(value)) return value;
                    if (typeof value === 'string' && value.trim() !== '' && Number.isFinite(Number(value))) return Number(value);
                    return undefined;
                };
                const readyReplicas = numberValue(status.readyReplicas ?? status.availableReplicas ?? status.activeReplicas);
                const desiredReplicas = numberValue(status.desiredReplicas ?? status.replicas ?? spec.replicas);
                const observedReplicas = readyReplicas === undefined
                    ? desiredReplicas === undefined ? '' : `${desiredReplicas}`
                    : desiredReplicas === undefined ? `${readyReplicas}` : `${readyReplicas}/${desiredReplicas}`;
                const fixedReplicas = numberValue(spec.replicas);
                const autoscaled = fixedReplicas === 0 || spec.targetCPU !== undefined;
                const scaleMin = numberValue(spec.minReplicas);
                const scaleMax = numberValue(spec.maxReplicas);
                const scaleValue = observedReplicas || (autoscaled
                    ? `${scaleMin ?? '—'}–${scaleMax ?? '—'}`
                    : fixedReplicas === undefined ? '—' : `${fixedReplicas}`);
                const scaleMeta = autoscaled
                    ? `Autoscaling ${scaleMin ?? '—'}–${scaleMax ?? '—'} · target ${spec.targetCPU ?? 75}% CPU`
                    : `Fixed · ${fixedReplicas ?? 'YAML-configured'} replica(s)`;
                const replicaMeta = status.replicaStatusStale
                    ? `Replica data stale${status.replicaStatusError ? ` (${status.replicaStatusError})` : ''}`
                    : status.replicaStatusError
                        ? `Replica data unavailable (${status.replicaStatusError})`
                        : '';

                $('#nuclio-status-function-name').text(metadata.name || node.name || '—');
                $('#nuclio-status-state').text(state);
                $('#nuclio-status-chip').attr('data-tone', tone);
                $('#nuclio-status-updated').text(`Updated ${new Date().toLocaleTimeString()}`);
                $('#nuclio-deployment-value').text(state);
                $('#nuclio-deployment-meta').text(status.error || status.message || metadata.namespace || 'Nuclio deployment state');
                $('#nuclio-runtime-value').text(spec.runtime || '—');
                $('#nuclio-runtime-meta').text(spec.handler ? `Handler: ${spec.handler}` : 'Handler not reported');
                $('#nuclio-scale-value').text(scaleValue);
                $('#nuclio-scale-meta').text([scaleMeta, replicaMeta].filter(Boolean).join(' · '));
                $('#nuclio-invocation-mode').text(`Strategy: ${mode}`);
                if (canUpdateElement(statusElement('nuclio-status'))) {
                    const signals = { ...status };
                    delete signals.state;
                    delete signals.internalInvocationUrls;
                    delete signals.externalInvocationUrls;
                    delete signals.replicas;
                    delete signals.availableReplicas;
                    delete signals.readyReplicas;
                    delete signals.desiredReplicas;
                    delete signals.activeReplicas;
                    delete signals.replicaStatusError;
                    delete signals.replicaStatusStale;
                    const signalHtml = statusChips(signals);
                    $('#nuclio-status').html(signalHtml);
                    $('#nuclio-status-signals').toggleClass('nuclio-hidden', !signalHtml);
                }
                renderEndpoints(status, invocation);
            };

            const detailError = (key, error) => {
                const message = error?.responseJSON?.error || error?.statusText || 'Unable to load this detail.';
                $(`#${detailCodeIds[key]}`).text(stripAnsi(message));
            };

            const loadDetail = (key, force = false) => {
                const details = {
                    runLogs: {
                        url: `/nuclio/api/functions/logs?id=${node.id}`,
                        render: (data) => {
                            const entries = Object.entries(data || {}).map(([replica, log]) => {
                                const text = stripAnsi(typeof log === 'string' ? log : JSON.stringify(log));
                                return `<div class="nuclio-log-entry"><b class="nuclio-log-level">${esc(replica)}</b><div>${esc(text || '-- no logs --')}</div></div>`;
                            }).join('');
                            $('#nuclio-logs').html(entries || 'No replica logs available.');
                        },
                    },
                    buildLogs: {
                        url: `/nuclio/api/functions?id=${node.id}&view=logs`,
                        render: (data) => {
                            const entries = (data?.logs || []).map(({ level, message, time, name, requestID, ...log }) =>
                                `<div class="nuclio-log-entry"><b class="nuclio-log-level">${esc(stripAnsi(level || 'log'))}</b> ${esc(stripAnsi(message || ''))}${Object.keys(log).length ? `<div style="padding-left: 12px;">${fmt(log)}</div>` : ''}</div>`
                            ).join('');
                            $('#nuclio-deploy-logs').html(entries || 'No build logs available.');
                        },
                    },
                    spec: {
                        url: `/nuclio/api/functions?id=${node.id}&view=spec`,
                        render: (data) => {
                            // Secret paths are redacted server-side before this
                            // response leaves Node-RED.
                            $('#nuclio-spec').text(JSON.stringify({ metadata: data?.metadata, spec: data?.spec }, null, 2));
                        },
                    },
                }[key];
                if (!details || (!force && detailRequests[key])) return detailRequests[key];
                $(`#${detailCodeIds[key]}`).text('Loading…');
                detailRequests[key] = ajaxJson({ url: details.url, method: 'GET' })
                    .done(details.render)
                    .fail((e) => detailError(key, e))
                    .always(() => { delete detailRequests[key]; });
                return detailRequests[key];
            };

            ['runLogs', 'buildLogs', 'spec'].forEach((key) => {
                const detailsId = key === 'runLogs' ? 'nuclio-detail-run-logs' : key === 'buildLogs' ? 'nuclio-detail-build-logs' : 'nuclio-detail-spec';
                statusElement(detailsId)?.addEventListener('toggle', function () {
                    if (this.open) loadDetail(key);
                });
            });
            $('#nuclio-refresh-run-logs').on('click', () => loadDetail('runLogs', true));
            $('#nuclio-refresh-build-logs').on('click', () => loadDetail('buildLogs', true));
            $('#nuclio-refresh-spec').on('click', () => loadDetail('spec', true));

            this.statusPoller = new Poller(() => {
                // bail if the editor dialog was closed without save/cancel
                if (!statusElement('nuclio-status-state')) {
                    node.statusPoller?.stop();
                    return;
                }
                return ajaxJson({
                    url: `/nuclio/api/functions?id=${this.id}&view=summary`,
                    method: 'GET',
                }).done(renderSummary).fail((e) => {
                    const message = e?.responseJSON?.error || e?.statusText || 'Unable to load function status.';
                    if (!canUpdateElement(statusElement('nuclio-status'))) return;
                    $('#nuclio-status').empty();
                    $('#nuclio-status-signals').addClass('nuclio-hidden');
                    $('#nuclio-status-state').text('unavailable');
                    $('#nuclio-status-chip').attr('data-tone', 'unavailable');
                    $('#nuclio-status-updated').text(`Last checked ${new Date().toLocaleTimeString()}`);
                    $('#nuclio-deployment-value').text('Status unavailable');
                    $('#nuclio-deployment-meta').text(`Nuclio status API unavailable: ${message}`);
                    $('#nuclio-runtime-value').text('Unavailable');
                    $('#nuclio-runtime-meta').text('Nuclio status API unavailable');
                    $('#nuclio-scale-value').text('Unavailable');
                    $('#nuclio-scale-meta').text('Nuclio status API unavailable');
                    $('#nuclio-invocation-mode').text('Unavailable');
                    $('#nuclio-endpoints').html('<div class="nuclio-status-section-note">Invocation endpoints unavailable.</div>');
                });
            }, 2400);

            /* ------------------------------------ Tabs ----------------------------------- */

            var tabs = RED.tabs.create({
                id: "nuclio-tabs",
                onchange: function(tab) {
                    $("#nuclio-tabs-content").children().hide();
                    $("#" + tab.id).show();
                    if (tab.id === "nuclio-tab-status") {
                        node.statusPoller.start();
                    } else {
                        node.statusPoller.stop();
                    }
                }
            });
            tabs.addTab({
                id: "nuclio-tab-app",
                label: "Code"
            });
            tabs.addTab({
                id: "nuclio-tab-deps",
                label: "Config"
            });
            tabs.addTab({
                id: "nuclio-tab-status",
                label: "Status"
            });

            tabs.activateTab("nuclio-tab-app");
        },
        oneditsave: function() {
            let node = this;

            const scalingMode = $('#node-config-input-scalingMode').val() || 'yaml';

            this.code = this.editor.getValue();
            this.editor.destroy();
            delete this.editor;
            this.configCode = this.configeditor.getValue();
            this.configeditor.destroy();
            delete this.configeditor;
            this.configEditorAssist?.destroy();
            delete this.configEditorAssist;
            this.statusPoller.stop();
            delete this.statusPoller;
            $('#node-config-dialog-edit-form').off('.nuclioFunctionDirty');
            delete this.nuclioEditorDirty;

            this.sourceType = $('#node-config-input-sourceType').val() || 'sourceCode';
            this.codeEntryPath = $('#node-config-input-codeEntryPath').val() || '';
            this.codeEntryBranch = $('#node-config-input-codeEntryBranch').val() || '';
            this.codeEntryTag = $('#node-config-input-codeEntryTag').val() || '';
            this.codeEntryReference = $('#node-config-input-codeEntryReference').val() || '';
            this.codeEntryUsername = $('#node-config-input-codeEntryUsername').val() || '';
            this.codeEntryWorkDir = $('#node-config-input-codeEntryWorkDir').val() || '';
            node.credentials = node.credentials || {};
            const codeEntryPassword = $('#node-config-input-codeEntryPassword').val() || '';
            if (codeEntryPassword) node.credentials.codeEntryPassword = codeEntryPassword;
            else if (node.credentials.codeEntryPassword !== '__PWRD__') delete node.credentials.codeEntryPassword;
            delete node.credentials.codeEntryToken;

            const envVars = collectKeyValueList("#node-config-input-env_vars-x");
            node.env_vars = NUCLIO_CREDENTIAL_LIST.saveEntries(node, 'environmentVariables', envVars);
            delete this.envList;
            node.envSecretRefs = collectSecretReferenceList('#node-config-input-env_secret_refs-x');
            delete this.envSecretRefList;

            node.credentials.deploymentVariables = JSON.stringify(
                collectDeploymentVariableList('#node-config-input-deploymentVariables-x'),
            );
            node.deploymentVariables = [];
            delete this.deploymentVariableList;

            this.executionTriggerName = $('#node-config-input-executionTriggerName').val() || '';
            this.executionMode = $('#node-config-input-executionMode').val() || 'inherit';
            this.executionBatchMode = $('#node-config-input-executionBatchMode').val() || 'inherit';
            this.executionBatchSize = $('#node-config-input-executionBatchSize').typedInput('value') || '';
            this.executionBatchTimeout = $('#node-config-input-executionBatchTimeout').typedInput('value') || '';
            this.executionWorkers = $('#node-config-input-executionWorkers').typedInput('value') || '';
            this.executionEventTimeout = $('#node-config-input-executionEventTimeout').typedInput('value') || '';

            const scalingNumberFields = ['scalingReplicas', 'scalingMinReplicas', 'scalingMaxReplicas', 'scalingTargetCPU'];
            const resourceFields = ['resourceRequestsCpu', 'resourceRequestsMemory', 'resourceLimitsCpu', 'resourceLimitsMemory'];
            this.scalingMode = scalingMode;
            scalingNumberFields.forEach(field => {
                this[field] = $('#node-config-input-' + field).typedInput('value') || '';
            });
            if (scalingMode === 'fixed') {
                ['scalingMinReplicas', 'scalingMaxReplicas', 'scalingTargetCPU'].forEach(field => {
                    this[field] = '';
                });
            } else if (scalingMode === 'autoscaled') {
                this.scalingReplicas = '';
            } else {
                scalingNumberFields.forEach(field => {
                    this[field] = '';
                });
            }
            resourceFields.forEach(field => {
                this[field] = $('#node-config-input-' + field).typedInput('value') || '';
            });

            // Recovery policy: numeric literal or env-var reference, resolved on deploy.
            ['maxSelfHealAttempts', 'redeployDeadlineMs'].forEach(field => {
                this[field] = $('#node-config-input-' + field).typedInput('value') || '';
            });
            this.autoRedeployOnUnhealthy = $('#node-config-input-autoRedeployOnUnhealthy').typedInput('value') || '';
            this.autoRedeployOnError = $('#node-config-input-autoRedeployOnError').typedInput('value') || '';

        },
        oneditcancel: function() {
            this.editor.destroy();
            delete this.editor;
            this.configeditor.destroy();
            delete this.configeditor;
            this.configEditorAssist?.destroy();
            delete this.configEditorAssist;
            this.statusPoller.stop();
            delete this.statusPoller;
            $('#node-config-dialog-edit-form').off('.nuclioFunctionDirty');
            delete this.nuclioEditorDirty;
            this.name = this.originalName;
            delete this.envList;
            delete this.envSecretRefList;
            delete this.deploymentVariableList;
        },
    });

</script>

<script type="text/html" data-template-name="nuclio-function">
    <div class="form-row nuclio-tabs-row">
        <ul style="margin-bottom: 20px;" id="nuclio-tabs"></ul>
    </div>
    <div id="nuclio-tabs-content">
        <div id="nuclio-tab-app" style="display:none">
            <section class="nuclio-source-card" aria-labelledby="nuclio-source-heading">
                <div class="nuclio-source-grid">
                    <div class="nuclio-source-control">
                        <label for="node-config-input-sourceType">Code entry type</label>
                        <select id="node-config-input-sourceType" class="form-control">
                            <option value="sourceCode">Source code</option>
                            <option value="image">Image</option>
                            <option value="git">Git</option>
                            <option value="archive">Archive</option>
                            <option value="advanced">Advanced configuration</option>
                        </select>
                    </div>
                    <div class="nuclio-source-control">
                        <label for="node-config-input-runtime">Runtime</label>
                        <select id="node-config-input-runtime" class="form-control"></select>
                    </div>
                    <div class="nuclio-source-control">
                        <label for="nuclio-handler-preview">Handler</label>
                        <input id="nuclio-handler-preview" class="form-control" type="text" readonly />
                    </div>
                </div>
                <p id="nuclio-source-heading" class="nuclio-source-note">
                    <b>Note:</b> Source settings here override matching source fields in the function configuration.
                </p>

                <div id="nuclio-source-path-field" class="nuclio-source-fields nuclio-hidden">
                    <label id="nuclio-source-path-label" for="node-config-input-codeEntryPath">URL <span class="nuclio-required">*</span></label>
                    <input id="node-config-input-codeEntryPath" class="form-control" type="text" />
                </div>
                <div id="nuclio-source-fields-image" class="nuclio-source-fields nuclio-hidden"></div>
                <div id="nuclio-source-fields-git" class="nuclio-source-fields nuclio-hidden">
                    <label for="node-config-input-codeEntryBranch">Branch</label>
                    <input id="node-config-input-codeEntryBranch" class="form-control" type="text" placeholder="For example: main" />
                    <label for="node-config-input-codeEntryTag">Tag</label>
                    <input id="node-config-input-codeEntryTag" class="form-control" type="text" placeholder="Enter tag" />
                    <label for="node-config-input-codeEntryReference">Reference</label>

<script type="text/html" data-help-name="nuclio-function">
    <p>Deploys and reconciles a Nuclio function from Node-RED. This config node owns
    the function's source, configuration, and lifecycle; a separate <b>Nuclio
    Invoke</b> node calls the function at runtime.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>Code</dt>
        <dd>Function source code stored in this config node.</dd>
        <dt>Config</dt>
        <dd>YAML function configuration applied on deploy.</dd>
        <dt>Environment Variables</dt>
        <dd>Key/value pairs injected into the function environment. Values are
        stored with the function configuration.</dd>
        <dt>Kubernetes Secret References</dt>
        <dd>Environment variables populated from Kubernetes Secret keys. Only the
        Secret name and key are stored; the Secret value is resolved by Kubernetes.</dd>
        <dt>Deployment Variables</dt>
        <dd>Function-scoped values interpolated into YAML with <code>${VAR}</code> or
        nested <code>${VAR:-fallback}</code>. Values can come from a literal, the
        Node-RED process environment, or an encrypted credential. Credential values
        are always secret; other values can be marked secret to prevent logging and
        redact matching status fields. The variable list is stored in Node-RED's
        encrypted credential store.</dd>
    </dl>
    <h3>Source</h3>
    <p>The <b>Code entry type</b> selects the function source: inline <b>Source
    code</b>, a container <b>Image</b>, a <b>Git</b> repository, or a downloadable
    <b>Archive</b>. <b>Advanced configuration</b> leaves source fields entirely to
    the Config tab. Source fields in the editor override matching fields in the
    YAML configuration. For Git and archive sources the Nuclio builder downloads
    the source, so it must be able to reach the repository or URL.</p>
    <h3>Execution, scaling, and resources</h3>
    <p>The <b>Execution</b> section configures the HTTP trigger (mode, batching,
    workers, event timeout); async and batched modes follow the handler contract
    described in the Nuclio documentation. <b>Scaling &amp; resources</b> selects
    YAML-controlled, fixed-replica, or CPU-autoscaled deployment. Autoscaled
    deployment with <code>minReplicas: 0</code> enables scale-to-zero on
    Kubernetes, which requires Nuclio's DLX component; the invoke node adds the
    <code>X-Nuclio-Target</code> header the DLX needs to wake the function.</p>
    <h3>Deployment</h3>
    <p>In <b>Eager</b> mode (default) the function deploys when Node-RED starts.
    In <b>Lazy</b> mode deployment waits for a <code>deploy</code> command through
    a connected <b>Nuclio Invoke</b> node. Unchanged functions are not redeployed;
    the <b>Redeploy</b> action reuses the existing image, while <b>Rebuild</b>
    forces a new image build. The <b>Status</b> tab shows live state, endpoints,
    and run/build logs, and exposes the raw function specification with secret
    paths redacted.</p>
</script>
