<script type="text/javascript">
    // Names already taken by other nuclio-function configs on the same
    // server/project (used by the name validator + generator).
    const getUniqueValues = (node, key) => {
        let endpoints = {};
        RED.nodes.eachConfig(n => {
            if (n.type !== "nuclio-function" || n.server !== node.server || n.project !== node.project || n.id === node.id) return;
            endpoints[key(n)] = n.id;
        });
        return endpoints;
    };

    class Poller {
        constructor(fn, interval) {
            this.fn = fn;
            this.interval = interval;
            this.pollInterval = null;
        }

        start() {
            if (this.pollInterval) return;
            this.fn();
            this.pollInterval = setInterval(this.fn, this.interval);
        }

        stop() {
            if (!this.pollInterval) return;
            clearInterval(this.pollInterval);
            this.pollInterval = null;
        }
    }

    // escape anything API/log-derived before it goes into innerHTML
    const esc = (s) => `${s}`.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const stripAnsi = (value) => `${value ?? ''}`
        .replace(/\u001B\[[0-?]*[ -/]*[@-~]/g, '')
        .replace(/\u009B[0-?]*[ -/]*[@-~]/g, '')
        .replace(/\r\n/g, '\n');

    const humanizeKey = (key) => `${key}`
        .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
        .replace(/[_-]+/g, ' ')
        .replace(/\bhttp\b/gi, 'HTTP')
        .replace(/\burl(s?)\b/gi, 'URL$1')
        .replace(/\bapi\b/gi, 'API')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/^\w/, c => c.toUpperCase());

    const fmt = (obj) => Object.entries(obj).map(([k,v]) => {
        if (typeof v === 'string' && v.includes('\n')) {
            return `<div class="nuclio-kv-row"><span class="nuclio-kv-key">${esc(humanizeKey(k))}</span><span class="nuclio-kv-value nuclio-kv-multiline">${esc(stripAnsi(v))}</span></div>`;
        }
        return `<div class="nuclio-kv-row"><span class="nuclio-kv-key">${esc(humanizeKey(k))}</span><span class="nuclio-kv-value">${esc(stripAnsi(JSON.stringify(v)))}</span></div>`;
    }).join('');

    const statusChips = (obj) => Object.entries(obj || {}).map(([k,v]) => {
        const value = stripAnsi(typeof v === 'string' ? v : JSON.stringify(v));
        return `<span class="nuclio-chip"><span class="nuclio-chip-key">${esc(humanizeKey(k))}</span><span class="nuclio-chip-value">${esc(value)}</span></span>`;
    }).join('');

    // don't clobber text the user is selecting/reading
    const canUpdateElement = (element) => {
        if (!element) return true;
        const selection = window.getSelection();
        if (!selection || selection.isCollapsed) return true;
        if (!selection.rangeCount) return true;
        const range = selection.getRangeAt(0);
        return !element.contains(range.commonAncestorContainer);
    };

    const statusTone = (state) => {
        if (!state || typeof state !== 'string') return 'unknown';
        if (state === 'unavailable') return 'unavailable';
        if (state === 'ready') return 'ok';
        if (state === 'error' || state === 'unhealthy') return 'error';
        if (state === 'scaledToZero') return 'idle';
        if (state.includes('waiting') || state === 'building' || state === 'configuringResources') return 'working';
        return 'warn';
    };

    // mirrors lib/util.js splitByDotWithEscape (browser-side copy for redaction)
    const splitByDotWithEscape = (str) => str.split(/(?<!\\)\./).map(part => part.replace(/\\\./g, '.'));

    const redactSecrets = (obj, secretVars) => {
        if (!obj) return obj;
        const redacted = JSON.parse(JSON.stringify(obj));
        for (const secret of secretVars || []) {
            if (!secret?.name) continue;
            const keys = splitByDotWithEscape(secret.name);
            const lastKey = keys.pop();
            let c = redacted;
            for (const key of keys) {
                if (!c || typeof c !== 'object') {
                    c = null;
                    break;
                }
                c = c[key];
            }
            if (c && Object.prototype.hasOwnProperty.call(c, lastKey)) {
                c[lastKey] = '[redacted]';
            }
        }
        return redacted;
    };

    const getAuthHeaders = () => {
        const headers = {};
        if (!RED.settings || typeof RED.settings.get !== 'function') return headers;
        const authTokens = RED.settings.get("auth-tokens") || {};
        const token = authTokens.access_token || authTokens.token;
        if (token) headers.Authorization = `Bearer ${token}`;
        return headers;
    };

    const ajaxJson = (options) => $.ajax({
        dataType: 'json',
        ...options,
        headers: {
            ...getAuthHeaders(),
            ...(options.headers || {}),
        },
    });

    const setActionFeedback = (message, tone = 'info') => {
        const feedback = document.getElementById('nuclio-action-feedback');
        if (!feedback) return;
        feedback.textContent = message || '';
        feedback.dataset.tone = tone;
        feedback.classList.toggle('nuclio-hidden', !message);
    };

    // key/value rows: a text key + a typed value. Shared by request headers,
    // environment variables, and secret overrides.
    const initKeyValueList = (selector, items, { placeholder, defaultType, types }) => {
        const list = $(selector).editableList({
            addItem: function(row, index, data) {
                $(`<input class='node-input-key' type="text" placeholder="${placeholder}" aria-label="Name" />`).appendTo(row).val(data.name)
                $(`<input class='node-input-value' placeholder="value" aria-label="Value" />`).appendTo(row).attr('value', data.value).typedInput({
                    defaultType: data.type || defaultType,
                    types: types,
                });
            },
            removable: true,
        });
        for (let data of items || []) {
            list.editableList('addItem', data);
        }
        return list;
    };

    const collectKeyValueList = (selector) => {
        const rows = [];
        $(selector).editableList('items').each(function() {
            const name = $(this).find(".node-input-key").val();
            const type = $(this).find(".node-input-value").typedInput('type');
            const value = $(this).find(".node-input-value").typedInput('value');
            name && rows.push({ name, type, value });
        });
        return rows;
    };
</script>

<script type="text/javascript">/* ---------------------------- Nuclio Function ----------------------------- */

    RED.nodes.registerType('nuclio-function', {
        category: 'config',
        icon: "nuclio.io.ico",
        defaults: {
            server: {
                type: 'nuclio-config',
                required: false,
            },
            project: {
                type: 'nuclio-project',
                required: false,
            },
            name: { value: '', validate: function(v) {
                if(!v) {
                    v = randomEndpoint();
                    let existing = getUniqueValues(this, n=>n.name);
                    while (existing[v]) {
                        v = randomEndpoint();
                    }
                    this.name = v;
                }
                return !getUniqueValues(this, n=>n.name)[v];
            } },
            runtime: { value: 'python:3.12' },
            sourceType: { value: 'sourceCode' },
            codeEntryPath: { value: '' },
            codeEntryBranch: { value: '' },
            codeEntryTag: { value: '' },
            codeEntryReference: { value: '' },
            codeEntryUsername: { value: '' },
            codeEntryWorkDir: { value: '' },
            code: { value: SAMPLES.python.code },
            configCode: { value: SAMPLES.python.config },
            env_vars: { value: [] },
            // legacy plaintext secrets - migrated into credentials on save
            secret_vars: { value: [] },
            // Recovery policy (blank = NUCLIO_* env, then default).
            maxSelfHealAttempts: { value: '' }, maxSelfHealAttemptsType: { value: 'num' },
            redeployDeadlineMs:  { value: '' }, redeployDeadlineMsType:  { value: 'num' },
            autoRedeployOnError: { value: 'false' }, autoRedeployOnErrorType: { value: 'bool' },
        },
        credentials: {
            secret_vars: { type: "text" },  // JSON list of { name, type, value }
            codeEntryPassword: { type: "password" },
        },
        label: function () {
            return this.name || 'nuclio fn';
        },
        oneditprepare: function() {
            let node = this;
            node.originalName = node.name;
            node.nuclioEditorDirty = false;

            const runtimeSelect = $('#node-config-input-runtime');
            const selectedRuntime = this.runtime || 'python:3.12';
            const runtimeOptions = [...RUNTIME_METADATA];
            if (selectedRuntime && !runtimeOptions.some(item => item.value === selectedRuntime)) {
                const [base] = selectedRuntime.split(':');
                runtimeOptions.push({
                    value: selectedRuntime,
                    base,
                    label: selectedRuntime,
                    language: 'text',
                    handler: 'main:handler',
                });
            }
            runtimeSelect.empty();
            runtimeOptions.forEach(item => $('<option>').val(item.value).text(item.label).appendTo(runtimeSelect));
            runtimeSelect.val(selectedRuntime);

            const markEditorDirty = () => {
                node.nuclioEditorDirty = true;
            };

            const confirmOperationalAction = (action) => {
                const savedState = node.nuclioEditorDirty
                    ? 'This editor has unsaved changes. '
                    : '';
                return window.confirm(`${savedState}${action} uses the last saved configuration, not unsaved editor changes. Continue?`);
            };

            /* ------------------------------ Buttons / Links ------------------------------ */

            const updateDashboardLink = () => {
                const name = $('#node-config-input-name').val();
                const project = RED.nodes.node(node.project)?.name || 'default';
                const server = RED.nodes.node(node.server);
                const publicAddress = server?.publicAddress || '';
                const fullUrl = publicAddress && name ? `${publicAddress.replace(/\/$/,'')}/projects/${project}/functions/${name}/code` : '';
                if (fullUrl) {
                    $('#nuclio-dashboard-link').attr('href', fullUrl).removeClass('nuclio-hidden');
                } else {
                    $('#nuclio-dashboard-link').addClass('nuclio-hidden');
                }
            };

            updateDashboardLink();

            $("#nuclio-dashboard-link").on('pointerdown', function () {
                let name = $('#node-config-input-name').val();
                if (!name) return;

                updateDashboardLink();
            });
            $('#node-config-input-name').on('input', updateDashboardLink);
            $('#node-config-input-project, #node-config-input-server').on('change', updateDashboardLink);
            $('#nuclio-redeploy').on('click', function() {
                if (!confirmOperationalAction('Redeploy the existing image for this Nuclio function now?')) return;
                const btn = $(this);
                btn.prop('disabled', true).text('Redeploying image...');
                setActionFeedback('Redeploying the existing image. Unsaved editor changes are not included.', 'working');
                ajaxJson({
                    url: `/nuclio/api/functions/deploy?id=${node.id}`,
                    method: 'POST',
                }).done(function() {
                    setActionFeedback('Redeploy request accepted. Status will refresh automatically.', 'ok');
                }).fail((e) => {
                    const message = e?.responseJSON?.error || e?.statusText || 'Redeploy failed.';
                    setActionFeedback(`Redeploy failed: ${message}`, 'error');
                }).always(() => {
                    btn.prop('disabled', false).text('Redeploy');
                });
            });
            $('#nuclio-rebuild').on('click', function() {
                if (!confirmOperationalAction('Re-fetch the source, rebuild the image, and redeploy this Nuclio function now?')) return;
                const btn = $(this);
                btn.prop('disabled', true).text('Rebuilding image...');
                setActionFeedback('Rebuilding the image. Unsaved editor changes are not included.', 'working');
                ajaxJson({
                    url: `/nuclio/api/functions/deploy?id=${node.id}&rebuild=true`,
                    method: 'POST',
                }).done(function() {
                    setActionFeedback('Rebuild request accepted. Status will refresh automatically.', 'ok');
                }).fail((e) => {
                    const message = e?.responseJSON?.error || e?.statusText || 'Rebuild failed.';
                    setActionFeedback(`Rebuild failed: ${message}`, 'error');
                }).always(() => {
                    btn.prop('disabled', false).text('Rebuild');
                });
            });
            $('#nuclio-generate-name').on('click', function() {
                markEditorDirty();
                let name = randomEndpoint();
                let existing = getUniqueValues(node, n=>n.name);
                while (existing[name]) {
                    name = randomEndpoint();
                }
                $('#node-config-input-name').val(name);
            });

            /* -------------------------------- Code Editors ------------------------------- */

            this.editor = RED.editor.createEditor({
                id: 'node-config-input-nuclio-editor',
                mode: `ace/mode/${langFor(node.runtime || 'python:3.12')}`,
                value: this.code || "",
                focus: true,
            });

            this.configeditor = RED.editor.createEditor({
                id: 'node-config-input-nuclio-config-editor',
                mode: `ace/mode/yaml`,
                value: this.configCode || "",
                focus: true,
            });

            const legacySource = sourceFromConfigCode(this.configCode);
            const sourceType = this.sourceType
                ? (SOURCE_TYPE_LABELS[this.sourceType] ? this.sourceType : 'advanced')
                : legacySource.type || 'sourceCode';
            $('#node-config-input-sourceType').val(sourceType);
            $('#node-config-input-codeEntryPath').val(this.codeEntryPath || legacySource.path || '');
            $('#node-config-input-codeEntryBranch').val(this.codeEntryBranch || legacySource.branch || '');
            $('#node-config-input-codeEntryTag').val(this.codeEntryTag || legacySource.tag || '');
            $('#node-config-input-codeEntryReference').val(this.codeEntryReference || legacySource.reference || '');
            $('#node-config-input-codeEntryUsername').val(this.codeEntryUsername || legacySource.username || '');
            $('#node-config-input-codeEntryWorkDir').val(this.codeEntryWorkDir || legacySource.workDir || '');
            $('#node-config-input-codeEntryPassword').val(this.credentials?.codeEntryPassword || '');

            const updateSourceFields = () => {
                const selected = $('#node-config-input-sourceType').val() || 'sourceCode';
                $('.nuclio-source-fields').addClass('nuclio-hidden');
                $(`#nuclio-source-fields-${selected}`).removeClass('nuclio-hidden');
                const external = selected !== 'sourceCode';
                const hasSourceFields = ['image', 'git', 'archive'].includes(selected);
                $('#nuclio-source-path-field').toggleClass('nuclio-hidden', !hasSourceFields);
                $('#nuclio-source-workdir-field').toggleClass('nuclio-hidden', !['git', 'archive'].includes(selected));
                $('#nuclio-source-path-label').html(selected === 'image'
                    ? 'Image name'
                    : 'URL <span class="nuclio-required">*</span>');
                $('#node-config-input-codeEntryPath').attr('placeholder', selected === 'image'
                    ? 'For example: mydockeruser/my-func:latest'
                    : selected === 'git'
                        ? 'For example: https://github.com/my-organization/my-repository.git'
                        : 'For example: https://example.com/my-function.zip');
                $('#nuclio-inline-code-note').toggleClass('nuclio-hidden', selected === 'sourceCode');
                $('#nuclio-inline-code-note').text(selected === 'advanced'
                    ? 'Advanced source configuration is controlled in the Config tab.'
                    : 'Online code is disabled for this source type. The repository or image above is deployed instead.');
                $('#node-config-input-nuclio-editor').toggleClass('nuclio-hidden', external);
                $('#nuclio-handler-preview').val(defaultHandlerFor($('#node-config-input-runtime').val()));
            };

            $('#node-config-input-sourceType').on('change', function() {
                updateSourceFields();
                markEditorDirty();
            });
            updateSourceFields();
            this.editor.on('change', markEditorDirty);
            this.configeditor.on('change', markEditorDirty);

            $('#node-config-input-runtime').on('change', function() {
                const runtime = $(this).val();
                const [runtimeBase] = runtime.split(':');
                const lang = langFor(runtime);
                console.log("Changing runtime & language", runtime, lang);

                let code = node.editor.getValue();
                let configCode = node.configeditor.getValue();
                const codes = Object.values(SAMPLES).map(v => v.code);
                const configCodes = Object.values(SAMPLES).map(v => v.config);
                const sample = SAMPLES[runtimeBase];
                if (sample && (code.trim() === '' || codes.includes(code))) {
                    code = sample.code;
                    node.editor.setValue(code);
                }
                if (sample && (configCode.trim() === '' || configCodes.includes(configCode))) {
                    node.configeditor.setValue(sample.config);
                }
                node.editor.setMode(`ace/mode/${lang}`);
                $('#nuclio-handler-preview').val(defaultHandlerFor(runtime));
            });

            /* ---------------------------------- Settings --------------------------------- */

            this.envList = initKeyValueList("#node-config-input-env_vars-x", this.env_vars, {
                placeholder: 'VAR_NAME',
                defaultType: 'str',
                types: ['str','num','json','env','cred'],
            });

            // Secrets are stored in Node-RED's encrypted credential store as a
            // JSON list; fall back to the legacy plaintext property for flows
            // saved before 1.2 (migrated into credentials on save).
            let secretVars = [];
            try {
                secretVars = JSON.parse(this.credentials?.secret_vars || '[]') || [];
            } catch (e) { /* ignore, fall back to legacy */ }
            if (!secretVars.length) secretVars = this.secret_vars || [];
            node.resolvedSecretVars = secretVars;

            this.secretList = initKeyValueList("#node-config-input-secret_vars-x", secretVars, {
                placeholder: 'VAR_NAME',
                defaultType: 'cred',
                types: ['env','cred'],
            });

            // Recovery policy: numeric literal or env-var reference, resolved on deploy.
            ['maxSelfHealAttempts','redeployDeadlineMs'].forEach(function(f){
                $('#node-config-input-' + f).typedInput({ default: node[f + 'Type'] || 'num', types: ['num','env'] });
            });
            $('#node-config-input-autoRedeployOnError').typedInput({ default: node.autoRedeployOnErrorType || 'bool', types: ['bool','env'] });

            // Track edits made in the dialog so operational actions can state
            // clearly that they use the last saved node configuration.
            const dialogForm = $('#dialog-form');
            dialogForm.on('input.nuclioFunctionDirty change.nuclioFunctionDirty', 'input, select, textarea', markEditorDirty);
            dialogForm.on('click.nuclioFunctionDirty', '#node-config-input-env_vars-x button, #node-config-input-secret_vars-x button', markEditorDirty);

            /* --------------------------------- Status Page -------------------------------- */

            const detailRequests = {};
            const detailCodeIds = {
                runLogs: 'nuclio-logs',
                buildLogs: 'nuclio-deploy-logs',
                spec: 'nuclio-spec',
            };
            const statusElement = (id) => document.getElementById(id);
            const asList = (value) => Array.isArray(value) ? value.filter(Boolean) : (value ? [value] : []);

            const renderEndpoints = (status, invocation) => {
                const effective = asList(invocation?.urls);
                const endpoints = effective.length
                    ? effective.map((url, index) => ({ label: index === 0 ? 'Active' : 'Candidate', url }))
                    : [
                        ...asList(status.internalInvocationUrls).map(url => ({ label: 'Reported internal', url })),
                        ...asList(status.externalInvocationUrls).map(url => ({ label: 'Reported external', url })),
                    ];
                const container = $('#nuclio-endpoints');
                if (!endpoints.length) {
                    container.html('<div class="nuclio-status-section-note">No invocation endpoint available.</div>');
                    return;
                }
                container.html(endpoints.map(({ label, url }) =>
                    `<div class="nuclio-endpoint-row"><span class="nuclio-endpoint-label">${esc(label)}</span><span class="nuclio-endpoint-value" title="${esc(url)}">${esc(url)}</span></div>`
                ).join(''));
            };

            const renderSummary = (data) => {
                const status = data?.status || {};
                const invocation = data?.invocation || {};
                const metadata = data?.metadata || {};
                const spec = data?.spec || {};
                const state = status.state || 'unknown';
                const tone = statusTone(state);
                const server = RED.nodes.node(node.server);
                const preference = invocation.preference || server?.invocationUrlPreference || 'service';
                const mode = preference === 'service'
                    ? 'Service name'
                    : preference === 'internal'
                        ? 'Dashboard internal URL'
                        : preference === 'external'
                            ? 'External URL'
                            : 'Service name';
                const scaleMin = spec.minReplicas ?? '—';
                const scaleMax = spec.maxReplicas ?? '—';

                $('#nuclio-status-function-name').text(metadata.name || node.name || '—');
                $('#nuclio-status-state').text(state);
                $('#nuclio-status-chip').attr('data-tone', tone);
                $('#nuclio-status-updated').text(`Updated ${new Date().toLocaleTimeString()}`);
                $('#nuclio-deployment-value').text(state);
                $('#nuclio-deployment-meta').text(status.error || status.message || metadata.namespace || 'Nuclio deployment state');
                $('#nuclio-runtime-value').text(spec.runtime || '—');
                $('#nuclio-runtime-meta').text(spec.handler ? `Handler: ${spec.handler}` : 'Handler not reported');
                $('#nuclio-scale-value').text(`${scaleMin}–${scaleMax}`);
                $('#nuclio-scale-meta').text(status.readyReplicas !== undefined ? `${status.readyReplicas} ready replica(s)` : 'Configured replicas');
                $('#nuclio-invocation-mode').text(mode);
                if (canUpdateElement(statusElement('nuclio-status'))) {
                    const signals = { ...status };
                    delete signals.state;
                    delete signals.internalInvocationUrls;
                    delete signals.externalInvocationUrls;
                    delete signals.replicas;
                    delete signals.availableReplicas;
                    delete signals.readyReplicas;
                    delete signals.desiredReplicas;
                    const signalHtml = statusChips(signals);
                    $('#nuclio-status').html(signalHtml);
                    $('#nuclio-status-signals').toggleClass('nuclio-hidden', !signalHtml);
                }
                renderEndpoints(status, invocation);
            };

            const detailError = (key, error) => {
                const message = error?.responseJSON?.error || error?.statusText || 'Unable to load this detail.';
                $(`#${detailCodeIds[key]}`).text(stripAnsi(message));
            };

            const loadDetail = (key, force = false) => {
                const details = {
                    runLogs: {
                        url: `/nuclio/api/functions/logs?id=${node.id}`,
                        render: (data) => {
                            const entries = Object.entries(data || {}).map(([replica, log]) => {
                                const text = stripAnsi(typeof log === 'string' ? log : JSON.stringify(log));
                                return `<div class="nuclio-log-entry"><b class="nuclio-log-level">${esc(replica)}</b><div>${esc(text || '-- no logs --')}</div></div>`;
                            }).join('');
                            $('#nuclio-logs').html(entries || 'No replica logs available.');
                        },
                    },
                    buildLogs: {
                        url: `/nuclio/api/functions?id=${node.id}&view=logs`,
                        render: (data) => {
                            const entries = (data?.logs || []).map(({ level, message, time, name, requestID, ...log }) =>
                                `<div class="nuclio-log-entry"><b class="nuclio-log-level">${esc(stripAnsi(level || 'log'))}</b> ${esc(stripAnsi(message || ''))}${Object.keys(log).length ? `<div style="padding-left: 12px;">${fmt(log)}</div>` : ''}</div>`
                            ).join('');
                            $('#nuclio-deploy-logs').html(entries || 'No build logs available.');
                        },
                    },
                    spec: {
                        url: `/nuclio/api/functions?id=${node.id}&view=spec`,
                        render: (data) => {
                            const safeSpec = redactSecrets({ spec: data?.spec }, node.resolvedSecretVars).spec;
                            $('#nuclio-spec').text(JSON.stringify({ metadata: data?.metadata, spec: safeSpec }, null, 2));
                        },
                    },
                }[key];
                if (!details || (!force && detailRequests[key])) return detailRequests[key];
                $(`#${detailCodeIds[key]}`).text('Loading…');
                detailRequests[key] = ajaxJson({ url: details.url, method: 'GET' })
                    .done(details.render)
                    .fail((e) => detailError(key, e))
                    .always(() => { delete detailRequests[key]; });
                return detailRequests[key];
            };

            ['runLogs', 'buildLogs', 'spec'].forEach((key) => {
                const detailsId = key === 'runLogs' ? 'nuclio-detail-run-logs' : key === 'buildLogs' ? 'nuclio-detail-build-logs' : 'nuclio-detail-spec';
                statusElement(detailsId)?.addEventListener('toggle', function () {
                    if (this.open) loadDetail(key);
                });
            });
            $('#nuclio-refresh-run-logs').on('click', () => loadDetail('runLogs', true));
            $('#nuclio-refresh-build-logs').on('click', () => loadDetail('buildLogs', true));
            $('#nuclio-refresh-spec').on('click', () => loadDetail('spec', true));

            this.statusPoller = new Poller(() => {
                // bail if the editor dialog was closed without save/cancel
                if (!statusElement('nuclio-status-state')) {
                    node.statusPoller?.stop();
                    return;
                }
                ajaxJson({
                    url: `/nuclio/api/functions?id=${this.id}&view=summary`,
                    method: 'GET',
                }).done(renderSummary).fail((e) => {
                    const message = e?.responseJSON?.error || e?.statusText || 'Unable to load function status.';
                    if (!canUpdateElement(statusElement('nuclio-status'))) return;
                    $('#nuclio-status').empty();
                    $('#nuclio-status-signals').addClass('nuclio-hidden');
                    $('#nuclio-status-state').text('unavailable');
                    $('#nuclio-status-chip').attr('data-tone', 'unavailable');
                    $('#nuclio-status-updated').text(`Last checked ${new Date().toLocaleTimeString()}`);
                    $('#nuclio-deployment-value').text('Status unavailable');
                    $('#nuclio-deployment-meta').text(`Nuclio status API unavailable: ${message}`);
                    $('#nuclio-runtime-value').text('Unavailable');
                    $('#nuclio-runtime-meta').text('Nuclio status API unavailable');
                    $('#nuclio-scale-value').text('Unavailable');
                    $('#nuclio-scale-meta').text('Nuclio status API unavailable');
                    $('#nuclio-invocation-mode').text('Unavailable');
                    $('#nuclio-endpoints').html('<div class="nuclio-status-section-note">Invocation endpoints unavailable.</div>');
                });
            }, 2400);

            /* ------------------------------------ Tabs ----------------------------------- */

            var tabs = RED.tabs.create({
                id: "nuclio-tabs",
                onchange: function(tab) {
                    $("#nuclio-tabs-content").children().hide();
                    $("#" + tab.id).show();
                    if (tab.id === "nuclio-tab-status") {
                        node.statusPoller.start();
                    } else {
                        node.statusPoller.stop();
                    }
                }
            });
            tabs.addTab({
                id: "nuclio-tab-app",
                label: "Code"
            });
            tabs.addTab({
                id: "nuclio-tab-deps",
                label: "Config"
            });
            tabs.addTab({
                id: "nuclio-tab-status",
                label: "Status"
            });

            tabs.activateTab("nuclio-tab-app");
        },
        oneditsave: function() {
            let node = this;
            this.code = this.editor.getValue();
            this.editor.destroy();
            delete this.editor;
            this.configCode = this.configeditor.getValue();
            this.configeditor.destroy();
            delete this.configeditor;
            this.statusPoller.stop();
            delete this.statusPoller;
            $('#dialog-form').off('.nuclioFunctionDirty');
            delete this.nuclioEditorDirty;

            this.sourceType = $('#node-config-input-sourceType').val() || 'sourceCode';
            this.codeEntryPath = $('#node-config-input-codeEntryPath').val() || '';
            this.codeEntryBranch = $('#node-config-input-codeEntryBranch').val() || '';
            this.codeEntryTag = $('#node-config-input-codeEntryTag').val() || '';
            this.codeEntryReference = $('#node-config-input-codeEntryReference').val() || '';
            this.codeEntryUsername = $('#node-config-input-codeEntryUsername').val() || '';
            this.codeEntryWorkDir = $('#node-config-input-codeEntryWorkDir').val() || '';
            node.credentials = node.credentials || {};
            const codeEntryPassword = $('#node-config-input-codeEntryPassword').val() || '';
            if (codeEntryPassword) node.credentials.codeEntryPassword = codeEntryPassword;
            else delete node.credentials.codeEntryPassword;
            delete node.credentials.codeEntryToken;

            node.env_vars = collectKeyValueList("#node-config-input-env_vars-x");
            delete this.envList;

            // Secrets go to the encrypted credential store; clear the legacy
            // plaintext property so it drops out of flows.json on this save.
            const secretVars = collectKeyValueList("#node-config-input-secret_vars-x");
            node.credentials = node.credentials || {};
            node.credentials.secret_vars = JSON.stringify(secretVars);
            node.secret_vars = [];
            delete this.secretList;
            delete this.resolvedSecretVars;
        },
        oneditcancel: function() {
            this.editor.destroy();
            delete this.editor;
            this.configeditor.destroy();
            delete this.configeditor;
            this.statusPoller.stop();
            delete this.statusPoller;
            $('#dialog-form').off('.nuclioFunctionDirty');
            delete this.nuclioEditorDirty;
            this.name = this.originalName;
            delete this.envList;
            delete this.secretList;
            delete this.resolvedSecretVars;
        },
    });

</script>

<script type="text/html" data-help-name="nuclio-function">
    <p>Deploys and reconciles a Nuclio function from Node-RED.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>Code</dt>
        <dd>Function source code stored in this config node.</dd>
        <dt>Config</dt>
        <dd>YAML function configuration applied on deploy.</dd>
        <dt>Environment Variables</dt>
        <dd>Key/value pairs injected into the function environment. Values are
        stored with the flow - put sensitive values in <b>Secret Overrides</b>
        (e.g. <code>spec.env.0.value</code>) or use the <code>env</code> type.</dd>
        <dt>Secret Overrides</dt>
        <dd>Typed values written into the config at the specified paths.
        Stored in Node-RED's encrypted credential store, not in the flow file.</dd>
    </dl>
    <h3>Details</h3>
    <p>This config node owns deployment and reconciliation. It creates or updates the
    Nuclio function in the selected project and keeps status refreshed while open.</p>
    <p>Use a separate <b>Nuclio Invoke</b> node to call the function at runtime.</p>
</script>
