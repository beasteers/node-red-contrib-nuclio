<style>
    .node_label_monospace {
        font-family: monospace;
        font-size: 0.82em;
        font-weight: 900;
    }

    .form-row small {
        max-width: 600px;
    }

    /* --------------------------- Nuclio Invoke editor ------------------------ */

    #node-input-headers .red-ui-editableList-item-content {
        display: flex;
        align-items: center;
        gap: 6px;
    }
    #node-input-headers .red-ui-editableList-item-content > input.node-input-key {
        flex: 0 0 40%;
    }
    #node-input-headers .red-ui-editableList-item-content > .red-ui-typedInput-container {
        flex: 1 1 auto;
        min-width: 0;
    }
    #node-input-headers .red-ui-editableList-item-content > input.node-input-value {
        width: 100%;
    }
</style>

<script type="text/javascript">
    const nuclioInvokeInitKeyValueList = (selector, items, { placeholder, defaultType, types }) => {
        const list = $(selector).editableList({
            addItem: function(row, index, data) {
                $(`<input class='node-input-key' type="text" aria-label="Name" />`)
                    .attr('placeholder', placeholder)
                    .appendTo(row).val(data.name || '');
                const valueInput = $(`<input class='node-input-value' type="text" placeholder="value" aria-label="Value" />`)
                    .appendTo(row).val(data.value || '');
                valueInput.typedInput({
                    default: data.type || defaultType,
                    types: types,
                });
            },
            removable: true,
        });
        for (let data of items || []) {
            list.editableList('addItem', data);
        }
        return list;
    };

    const nuclioInvokeCollectKeyValueList = (selector) => {
        const rows = [];
        $(selector).editableList('items').each(function() {
            const name = $(this).find(".node-input-key").val();
            const type = $(this).find(".node-input-value").typedInput('type');
            const value = $(this).find(".node-input-value").typedInput('value');
            name && rows.push({ name, type, value });
        });
        return rows;
    };

</script>

<script type="text/javascript">/* ------------------------------ Nuclio Invoke ----------------------------- */

    RED.nodes.registerType('nuclio', {
        category: 'function',
        color: '#65a9fc',
        inputs: 1,
        outputs: 2,
        outputLabels: ['result', 'fallback'],
        icon: "nuclio.io.ico",
        defaults: {
            function: {
                type: 'nuclio-function',
                required: true,
            },
            timeoutMs: { value: '' },
            timeoutMsType: { value: 'num' },
            maxInFlight: { value: '' },
            maxInFlightType: { value: 'num' },
            retries: { value: '' },
            retriesType: { value: 'num' },
            retryDelayMs: { value: '' },
            retryDelayMsType: { value: 'num' },
            headers: { value: [] },
        },
        label: function () {
            const fn = RED.nodes.node(this.function);
            return fn?.name || 'nuclio invoke';
        },
        oneditprepare: function() {
            const initTypedInput = (field, fallback) => {
                const typeFieldSelector = '#node-input-' + field + 'Type';
                const typeField = $(typeFieldSelector);
                if (!typeField.val()) typeField.val(this[field + 'Type'] || fallback);
                $('#node-input-' + field).typedInput({
                    typeField: typeFieldSelector,
                    types: ['num', 'env'],
                });
            };
            ['timeoutMs', 'maxInFlight', 'retries', 'retryDelayMs'].forEach(field => initTypedInput(field, 'num'));
            this.headersList = nuclioInvokeInitKeyValueList("#node-input-headers", this.headers, {
                placeholder: 'Header',
                defaultType: 'str',
                types: ['str','num','json','env','cred'],
            });
        },
        oneditsave: function() {
            this.headers = nuclioInvokeCollectKeyValueList("#node-input-headers");
            delete this.headersList;
        },
        oneditcancel: function() {
            delete this.headersList;
        },
    });

</script>

<script type="text/html" data-template-name="nuclio">
    <div class="nuclio-form-container">
    <div class="form-row">
        <label for="node-input-function">
            <span>Function <span aria-hidden="true">*</span></span>
        </label>
        <input type="text" id="node-input-function" aria-required="true" />
        <small>Invoke a shared Nuclio function configuration.</small>
        <div>
        </div>
    </div>
    <div class="form-row">
        <label for="node-input-timeoutMs">
            <span>Timeout (ms)</span>
        </label>
        <input type="text" id="node-input-timeoutMs" inputmode="numeric" min="0" aria-describedby="node-input-timeoutMs-help" placeholder="30000" />
        <input type="hidden" id="node-input-timeoutMsType" />
        <small id="node-input-timeoutMs-help">Function call timeout in milliseconds. Blank uses the built-in default of <b>30,000 ms</b>.</small>
        <div>
        </div>
    </div>
    <div class="form-row">
        <label for="node-input-maxInFlight">
            <span>Concurrency Cap</span>
        </label>
        <input type="text" id="node-input-maxInFlight" inputmode="numeric" min="0" aria-describedby="node-input-maxInFlight-help" placeholder="0 = unlimited" />
        <input type="hidden" id="node-input-maxInFlightType" />
        <small id="node-input-maxInFlight-help">Limits in-flight requests; excess messages go to the fallback output. Blank or <b>0</b> means unlimited.</small>
        <div>
        </div>
    </div>
    <div class="form-row">
        <label for="node-input-retries">
            <span>Retries</span>
        </label>
        <input type="text" id="node-input-retries" inputmode="numeric" min="0" aria-describedby="node-input-retries-help" placeholder="0 = no retry" />
        <input type="hidden" id="node-input-retriesType" />
        <small id="node-input-retries-help">Transient failures are retried this many times. Blank uses the built-in default of <b>0</b>. Retries are at-least-once.</small>
        <div>
        </div>
    </div>
    <div class="form-row">
        <label for="node-input-retryDelayMs">
            <span>Retry Delay (ms)</span>
        </label>
        <input type="text" id="node-input-retryDelayMs" inputmode="numeric" min="0" aria-describedby="node-input-retryDelayMs-help" placeholder="500 ms" />
        <input type="hidden" id="node-input-retryDelayMsType" />
        <small id="node-input-retryDelayMs-help">First retry delay; doubles on each retry (capped at 10s). Blank uses the built-in default of <b>500 ms</b>. A numeric <code>Retry-After</code> wins when larger.</small>
        <div>
        </div>
    </div>
    <div class="form-row node-input-list-row">
        <label for="node-input-headers">
            Request Headers
        </label>
        <small>Optional headers to include with each invocation.</small>
        <div>
        </div>
        <ol id="node-input-headers"></ol>
    </div>
    </div>
</script>

<script type="text/html" data-help-name="nuclio">
    <p>Invokes a shared Nuclio function configuration.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload</dt>
        <dd>Request body sent to the function.</dd>
        <dt>nuclio.command</dt>
        <dd>Optional lifecycle command: <code>deploy</code>, <code>undeploy</code>,
        <code>redeploy</code>, <code>rebuild</code>, or <code>status</code>. Command messages are handled
        by Node-RED and are never sent to the function.</dd>
    </dl>
    <h3>Outputs</h3>
    <ol class="node-ports">
        <li>Result
            <dl class="message-properties">
                <dt>payload</dt>
                <dd>Response body from the function.</dd>
                <dt>statusCode</dt>
                <dd>HTTP status code returned by the function.</dd>
                <dt>statusText</dt>
                <dd>HTTP status text.</dd>
                <dt>headers</dt>
                <dd>Response headers.</dd>
                <dt>response</dt>
                <dd>Raw axios response object.</dd>
                <dt>requestDurationMs</dt>
                <dd>Elapsed time in ms for the request.</dd>
            </dl>
        </li>
        <li>Fallback
            <dl class="message-properties">
                <dt>payload</dt>
                <dd>Unchanged input payload when the function is unavailable, or the
                error response body when the function returned an error status.</dd>
                <dt>error</dt>
                <dd><code>{ message, code }</code> describing the failure (set on every
                fallback caused by an error).</dd>
                <dt>statusCode</dt>
                <dd>HTTP status when the function responded with an error; otherwise the
                connection error code (e.g. <code>ECONNREFUSED</code>).</dd>
            </dl>
        </li>
    </ol>
    <h3>Details</h3>
    <p>Select a <b>Nuclio Function</b> config node to invoke. Optional headers,
    timeout, concurrency cap, and retries apply per node instance.</p>
    <p>Transient failures &mdash; connection errors and 429/502/503/504 responses
    (the function scaling or redeploying) &mdash; are retried up to <b>Retries</b>
    times with exponential backoff (honoring a numeric <code>Retry-After</code>
    header), then route to the fallback output without triggering Catch nodes.
    Retries are at-least-once: a transiently failed request may still have
    reached the function. Other errors are reported to <b>Catch</b> nodes.</p>
    <p><b>Note:</b> header values are stored with the flow (the credential type
    only masks the input). For sensitive headers, use the <code>env</code> type
    and provide the value via an environment variable.</p>
    <p>Commands are acknowledged on the result output and failures are sent to the
    fallback output. <code>deploy</code> is idempotent and activates a Lazy function;
    <code>redeploy</code> reuses the existing image; <code>rebuild</code> forces a full
    build; <code>status</code> returns the cached lifecycle state without deploying.</p>
</script>
