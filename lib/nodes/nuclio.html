<script type="text/javascript" src="/resources/@bea.steers/node-red-contrib-nuclio/nuclio-credential-list.js"></script>

<script type="text/javascript">
    const nuclioInvokeInitKeyValueList = (selector, items, { placeholder, defaultType, types }) => {
        const list = $(selector).editableList({
            addItem: function(row, index, data) {
                $(`<input class='node-input-key' type="text" aria-label="Name" />`)
                    .attr('placeholder', placeholder)
                    .appendTo(row).val(data.name || '');
                const valueInput = $(`<input class='node-input-value' type="text" placeholder="value" aria-label="Value" />`)
                    .appendTo(row).val(data.value || '');
                valueInput.typedInput({
                    default: data.type || defaultType,
                    types: types,
                });
            },
            removable: true,
        });
        for (let data of items || []) {
            list.editableList('addItem', data);
        }
        return list;
    };

    const nuclioInvokeCollectKeyValueList = (selector) => {
        const rows = [];
        $(selector).editableList('items').each(function() {
            const name = $(this).find(".node-input-key").val();
            const type = $(this).find(".node-input-value").typedInput('type');
            const value = $(this).find(".node-input-value").typedInput('value');
            name && rows.push({ name, type, value });
        });
        return rows;
    };

    const nuclioInvokeAuthHeaders = () => {
        const headers = {};
        if (!RED.settings || typeof RED.settings.get !== 'function') return headers;
        const authTokens = RED.settings.get('auth-tokens') || {};
        const token = authTokens.access_token || authTokens.token;
        if (token) headers.Authorization = `Bearer ${token}`;
        return headers;
    };

    const nuclioInvokeAjaxJson = (options) => $.ajax({
        dataType: 'json',
        ...options,
        headers: {
            ...nuclioInvokeAuthHeaders(),
            ...(options.headers || {}),
        },
    });

    const nuclioInvokeTriggerLabel = kind => {
        const labels = {
            http: 'HTTP',
            nats: 'NATS',
            kafka: 'Kafka',
            mqtt: 'MQTT',
            cron: 'Cron',
            v3iostream: 'V3IO stream',
        };
        return labels[kind] || `${kind || 'Unknown'} trigger`;
    };

    const nuclioInvokeTriggerGuidance = trigger => {
        const kind = `${trigger?.kind || ''}`.toLowerCase();
        const topic = trigger?.topic || 'the configured topic';
        const schedule = trigger?.schedule || 'the configured schedule';
        const message = $('<p class="nuclio-trigger-note"></p>');
        if (kind === 'nats') {
            message.append('Function will be invoked for each message published to the NATS topic: ');
            message.append($('<code></code>').text(topic));
        } else if (kind === 'kafka') {
            message.append('Function will be invoked for each message published to the Kafka topic: ');
            message.append($('<code></code>').text(topic));
        } else if (kind === 'mqtt') {
            message.append('Function will be invoked for each message published to the MQTT topic: ');
            message.append($('<code></code>').text(topic));
        } else if (kind === 'cron') {
            message.append('Function will be invoked according to the Cron schedule: ');
            message.append($('<code></code>').text(schedule));
        } else if (kind === 'v3iostream') {
            message.text('Function will be invoked by messages arriving on the configured V3IO stream.');
        } else {
            message.text(`Function will be invoked by the ${nuclioInvokeTriggerLabel(kind)}.`);
        }
        return message;
    };

    const nuclioInvokeRenderTriggers = (triggers, state = 'known') => {
        const sections = $('#nuclio-trigger-sections');
        const httpFields = $('#nuclio-http-fields').detach();
        sections.empty();
        let httpFieldsPlaced = false;
        const entries = Array.isArray(triggers) ? triggers : [];

        if (state === 'unknown') {
            const section = $('<section class="nuclio-trigger-section"></section>');
            section.append('<h3>HTTP</h3>');
            section.append('<p class="nuclio-trigger-note">Trigger details are unavailable until the function status can be read. These settings apply if the function has an HTTP trigger.</p>');
            section.append(httpFields.removeClass('nuclio-hidden'));
            sections.append(section);
            httpFieldsPlaced = true;
        } else if (!entries.length) {
            sections.append('<p class="nuclio-trigger-note">No triggers are configured for this function. Lifecycle commands remain available.</p>');
        } else {
            entries.forEach(trigger => {
                const kind = `${trigger?.kind || 'unknown'}`.toLowerCase();
                const title = nuclioInvokeTriggerLabel(kind);
                const section = $('<section class="nuclio-trigger-section"></section>');
                const heading = $('<h3></h3>').text(title);
                if (trigger?.name && trigger.name !== 'default-http') {
                    heading.append($('<small></small>').text(` (${trigger.name})`));
                }
                section.append(heading);
                if (kind === 'http' && !httpFieldsPlaced) {
                    section.append('<p class="nuclio-trigger-note">HTTP request settings for this Invoke node.</p>');
                    section.append(httpFields.removeClass('nuclio-hidden'));
                    httpFieldsPlaced = true;
                } else if (kind === 'http') {
                    section.append('<p class="nuclio-trigger-note">HTTP request settings are shown in the first HTTP trigger section.</p>');
                } else {
                    section.append(nuclioInvokeTriggerGuidance(trigger));
                }
                sections.append(section);
            });
        }

        if (!httpFieldsPlaced) {
            $('#nuclio-http-fields-fallback').append(httpFields.addClass('nuclio-hidden'));
        }
    };

</script>

<script type="text/javascript">/* ------------------------------ Nuclio Invoke ----------------------------- */

    RED.nodes.registerType('nuclio', {
        category: 'function',
        color: '#65a9fc',
        inputs: 1,
        outputs: 2,
        outputLabels: ['result', 'fallback'],
        icon: "nuclio.io.ico",
        defaults: {
            function: {
                type: 'nuclio-function',
                required: true,
            },
            timeoutMs: { value: '' },
            timeoutMsType: { value: 'num' },
            maxInFlight: { value: '' },
            maxInFlightType: { value: 'num' },
            retries: { value: '' },
            retriesType: { value: 'num' },
            retryDelayMs: { value: '' },
            retryDelayMsType: { value: 'num' },
            headers: { value: [] },
        },
        credentials: {
            headerCredentials: { type: 'text' },
        },
        label: function () {
            const fn = RED.nodes.node(this.function);
            return fn?.name || 'nuclio invoke';
        },
        oneditprepare: function() {
            const node = this;
            const initTypedInput = (field, fallback) => {
                const typeFieldSelector = '#node-input-' + field + 'Type';
                const typeField = $(typeFieldSelector);
                if (!typeField.val()) typeField.val(this[field + 'Type'] || fallback);
                $('#node-input-' + field).typedInput({
                    typeField: typeFieldSelector,
                    types: ['num', 'env'],
                });
            };
            ['timeoutMs', 'maxInFlight', 'retries', 'retryDelayMs'].forEach(field => initTypedInput(field, 'num'));
            const headers = NUCLIO_CREDENTIAL_LIST.getEntries(this, this.headers, 'headerCredentials');
            this.headersList = nuclioInvokeInitKeyValueList("#node-input-headers", headers, {
                placeholder: 'Header',
                defaultType: 'str',
                types: ['str','num','json','env','cred'],
            });

            const renderUnavailable = () => nuclioInvokeRenderTriggers([], 'unknown');
            const loadTriggers = () => {
                const functionId = $('#node-input-function').val() || node.function;
                if (!functionId) return renderUnavailable();
                nuclioInvokeRenderTriggers([], 'unknown');
                nuclioInvokeAjaxJson({
                    url: `/nuclio/api/functions/triggers?id=${encodeURIComponent(functionId)}`,
                    method: 'GET',
                }).done(data => {
                    const triggers = data?.triggerSummaries;
                    nuclioInvokeRenderTriggers(triggers, Array.isArray(triggers) ? 'known' : 'unknown');
                }).fail(renderUnavailable);
            };
            $('#node-input-function').off('change.nuclioTriggers').on('change.nuclioTriggers', loadTriggers);
            node.loadTriggers = loadTriggers;
            loadTriggers();
        },
        oneditsave: function() {
            const headers = nuclioInvokeCollectKeyValueList("#node-input-headers");
            this.headers = NUCLIO_CREDENTIAL_LIST.saveEntries(
                this,
                'headerCredentials',
                headers,
                name => `${name || ''}`.trim().toLowerCase(),
            );
            delete this.headersList;
        },
        oneditcancel: function() {
            $('#node-input-function').off('change.nuclioTriggers');
            delete this.headersList;
            delete this.loadTriggers;
        },
    });

</script>

<script type="text/html" data-template-name="nuclio">
    <div class="nuclio-form-container">
    <div class="form-row">
        <label for="node-input-function">
            <span>Function <span aria-hidden="true">*</span></span>
        </label>
        <input type="text" id="node-input-function" aria-required="true" />
        <small>Invoke a shared Nuclio function configuration.</small>
        <small class="nuclio-trigger-note">
            Nuclio functions can define and select different event triggers, including HTTP, NATS, MQTT, Kafka, and Cron.
            This node invokes the function through its HTTP trigger; other trigger types are invoked directly by Nuclio.
            See the <a target="_blank" rel="noopener noreferrer" href="https://nuclio.io/docs/latest/reference/triggers/">Nuclio trigger reference</a>.
        </small>
        <div>
        </div>
    </div>
    <div id="nuclio-trigger-sections" class="nuclio-trigger-sections">
        <p class="nuclio-trigger-note">Loading configured triggers…</p>
    </div>
    <div id="nuclio-http-fields-fallback"></div>
    <div id="nuclio-http-fields" class="nuclio-hidden">
        <div class="form-row">
            <label for="node-input-timeoutMs"><span>Timeout (ms)</span></label>
            <input type="text" id="node-input-timeoutMs" inputmode="numeric" min="0" aria-describedby="node-input-timeoutMs-help" placeholder="30000" />
            <input type="hidden" id="node-input-timeoutMsType" />
            <small id="node-input-timeoutMs-help">Function call timeout in milliseconds. Blank uses the built-in default of <b>30,000 ms</b>.</small>
        </div>
        <div class="form-row">
            <label for="node-input-maxInFlight"><span>Concurrency Cap</span></label>
            <input type="text" id="node-input-maxInFlight" inputmode="numeric" min="0" aria-describedby="node-input-maxInFlight-help" placeholder="0 = unlimited" />
            <input type="hidden" id="node-input-maxInFlightType" />
            <small id="node-input-maxInFlight-help">Limits in-flight requests; excess messages go to the fallback output. Blank or <b>0</b> means unlimited.</small>
        </div>
        <div class="form-row">
            <label for="node-input-retries"><span>Retries</span></label>
            <input type="text" id="node-input-retries" inputmode="numeric" min="0" aria-describedby="node-input-retries-help" placeholder="0 = no retry" />
            <input type="hidden" id="node-input-retriesType" />
            <small id="node-input-retries-help">Transient failures are retried this many times. Blank uses the built-in default of <b>0</b>. Retries are at-least-once.</small>
        </div>
        <div class="form-row">
            <label for="node-input-retryDelayMs"><span>Retry Delay (ms)</span></label>
            <input type="text" id="node-input-retryDelayMs" inputmode="numeric" min="0" aria-describedby="node-input-retryDelayMs-help" placeholder="500 ms" />
            <input type="hidden" id="node-input-retryDelayMsType" />
            <small id="node-input-retryDelayMs-help">First retry delay; doubles on each retry (capped at 10s). Blank uses the built-in default of <b>500 ms</b>. A numeric <code>Retry-After</code> wins when larger.</small>
        </div>
        <div class="form-row node-input-list-row">
            <label for="node-input-headers">Request Headers</label>
            <small>Optional headers to include with each invocation.</small>
            <ol id="node-input-headers"></ol>
        </div>
    </div>
    </div>
</script>

<script type="text/html" data-help-name="nuclio">
    <p>Invokes a shared Nuclio function configuration.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload</dt>
        <dd>Request body sent to the function.</dd>
        <dt>nuclio.command</dt>
        <dd>Optional lifecycle command: <code>deploy</code>, <code>undeploy</code>,
        <code>redeploy</code>, <code>rebuild</code>, or <code>status</code>. Command messages are handled
        by Node-RED and are never sent to the function.</dd>
    </dl>
    <h3>Outputs</h3>
    <ol class="node-ports">
        <li>Result
            <dl class="message-properties">
                <dt>payload</dt>
                <dd>Response body from the function.</dd>
                <dt>statusCode</dt>
                <dd>HTTP status code returned by the function.</dd>
                <dt>statusText</dt>
                <dd>HTTP status text.</dd>
                <dt>headers</dt>
                <dd>Response headers.</dd>
                <dt>response</dt>
                <dd>Response data, status, status text, and response headers. Request configuration is omitted.</dd>
                <dt>requestDurationMs</dt>
                <dd>Elapsed time in ms for the request.</dd>
            </dl>
        </li>
        <li>Fallback
            <dl class="message-properties">
                <dt>payload</dt>
                <dd>Unchanged input payload. If the function returned an error
                response, its body is available at <code>msg.response.data</code>.</dd>
                <dt>error</dt>
                <dd><code>{ message, code }</code> describing the failure (set on every
                fallback caused by an error).</dd>
                <dt>statusCode</dt>
                <dd>HTTP status when the function responded with an error; otherwise the
                connection error code (e.g. <code>ECONNREFUSED</code>).</dd>
            </dl>
        </li>
    </ol>
    <h3>Details</h3>
    <p>Select a <b>Nuclio Function</b> config node to invoke. Optional headers,
    timeout, concurrency cap, and retries apply per node instance.</p>
    <p>Transient failures &mdash; connection errors and 429/502/503/504 responses
    (the function scaling or redeploying) &mdash; are retried up to <b>Retries</b>
    times with exponential backoff (honoring a numeric <code>Retry-After</code>
    header), then route to the fallback output without triggering Catch nodes.
    Retries are at-least-once: a transiently failed request may still have
    reached the function. Other errors are reported to <b>Catch</b> nodes.</p>
    <p><b>Note:</b> header values selected as credentials are stored in Node-RED's
    credential store and are not included in the ordinary flow configuration.</p>
    <p>Commands are acknowledged on the result output and failures are sent to the
    fallback output. <code>deploy</code> is idempotent and activates a Lazy function;
    <code>redeploy</code> reuses the existing image; <code>rebuild</code> forces a full
    build; <code>status</code> returns the cached lifecycle state without deploying.</p>
</script>
