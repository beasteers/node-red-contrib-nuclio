name: nuclio-nats-example

services:
  nodered:
    build:
      context: ../..
      dockerfile: examples/nats/Dockerfile
    image: nodered-nuclio-nats-example
    restart: unless-stopped
    ports:
      - "${NODE_RED_PORT:-1882}:1880"
    environment:
      NUCLIO_ADDRESS: http://nuclio-dashboard:8070
    volumes:
      - ./data:/data
      - ../../config/settings.js:/data/settings.js
      - ../..:/usr/src/node-red/node-red-contrib-nuclio
    depends_on:
      nuclio-dashboard:
        condition: service_healthy
      nats:
        condition: service_healthy

  nuclio-dashboard:
    image: ${NUCLIO_DASHBOARD_IMAGE:-quay.io/nuclio/dashboard:1.17.5-${NUCLIO_ARCH:-arm64}}
    restart: unless-stopped
    ports:
      - "${NUCLIO_PORT:-8072}:8070"
    environment:
      NUCLIO_CHECK_FUNCTION_CONTAINERS_HEALTHINESS: "true"
      NUCLIO_ARCH: ${NUCLIO_ARCH:-arm64}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/platform.yaml:/etc/nuclio/config/platform/platform.yaml:ro

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "${NATS_PORT:-4222}:4222"
    volumes:
      - ./config/nats-server.conf:/etc/nats/nats-server.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
