apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-red-scale-to-zero
  labels:
    app.kubernetes.io/name: node-red-scale-to-zero
    app.kubernetes.io/component: reference-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: node-red-scale-to-zero
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-red-scale-to-zero
    spec:
      initContainers:
        - name: seed-node-red
          image: busybox:1.36
          command:
            - sh
            - -c
            - cp /config/settings.js /data/settings.js && cp /config/flows.json /data/flows.json
          volumeMounts:
            - name: node-red-data
              mountPath: /data
            - name: node-red-settings
              mountPath: /config/settings.js
              subPath: settings.js
              readOnly: true
            - name: node-red-flows
              mountPath: /config/flows.json
              subPath: flows.json
              readOnly: true
      containers:
        - name: node-red
          image: nodered-nuclio-reference:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 1880
          env:
            - name: NODE_RED_PORT
              value: "1880"
            - name: NUCLIO_DASHBOARD_URL
              value: http://nuclio-dashboard.nuclio.svc.cluster.local:8070
            - name: NUCLIO_NAMESPACE
              value: nuclio
            - name: NUCLIO_PROJECT
              value: example-scale-to-zero
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: node-red-data
              mountPath: /data
      volumes:
        - name: node-red-data
          emptyDir: {}
        - name: node-red-settings
          configMap:
            name: node-red-scale-to-zero-settings
        - name: node-red-flows
          configMap:
            name: node-red-scale-to-zero-flows
