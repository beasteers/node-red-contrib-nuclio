
services:
  nodered:
    build: 
      context: .
    image: nodered-nuclio
    container_name: nodered-nuclio
    restart: unless-stopped
    ports:
      - 1882:1880
    environment:
      NUCLIO_ADDRESS: http://nuclio-dashboard:8070
      NUCLIO_ARCH_PREFIX: ${NUCLIO_ARCH_PREFIX-arm64v8/}
    volumes:
      - ./data:/data
      - ./config/settings.js:/data/settings.js
      - .:/usr/src/node-red/node-red-contrib-nuclio

  nuclio-dashboard:
    # Set these explicitly for the host architecture. The dashboard image is
    # architecture-specific; failing closed avoids silently pulling arm64 on
    # an amd64 host.
    image: ${NUCLIO_DASHBOARD_IMAGE:-quay.io/nuclio/dashboard:1.17.5-${NUCLIO_ARCH:-arm64}}
    container_name: nuclio
    restart: unless-stopped
    ports:
      - 8072:8070
    environment:
      NUCLIO_CHECK_FUNCTION_CONTAINERS_HEALTHINESS: "true"  # not sure if this is helping
      # DOCKER_BUILDKIT: "1"
      NUCLIO_ARCH: ${NUCLIO_ARCH:-arm64}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/platform.yaml:/etc/nuclio/config/platform/platform.yaml  # for the network name

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - 1883:1883
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  nats:
    image: nats:2.10-alpine
    container_name: nats
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - 4222:4222
      - 1884:1883
    volumes:
      - ./config/nats-server.conf:/etc/nats/nats-server.conf:ro

